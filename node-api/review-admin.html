<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Review Halte — Semarang BRT</title>
<style>
  :root {
    /* Palet "peta ops malam" -- teal gelap ala peta transit dicetak di atas
       meja, bukan default cream/terracotta atau dark/neon AI. Amber dipakai
       khusus buat status "pending" (kayak lampu sinyal), bukan dekorasi. */
    --bg: #0F1B1E;
    --surface: #16262A;
    --surface-2: #1C3238;
    --border: #274046;
    --text: #E7EEEE;
    --text-dim: #8CA3A8;
    --amber: #F2A93B;
    --merge: #4FAE7C;
    --merge-dim: #2E5C46;
    --split: #E2664F;
    --split-dim: #5C332C;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header h1 .eyebrow {
    display: block;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--amber);
    margin-bottom: 4px;
  }

  #count-badge {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
  }
  #count-badge b { color: var(--amber); font-weight: 600; }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .state-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.6;
  }
  .state-msg .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .card.resolving { opacity: 0.35; pointer-events: none; transform: scale(0.98); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .metric {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 12px;
  }
  .metric b { color: var(--amber); font-weight: 600; }

  .compare {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 14px;
    align-items: center;
  }
  .halte {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .halte .nama { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .halte .koridor {
    font-size: 11px;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .halte .coord {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .vs {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .btn-merge { background: var(--merge-dim); color: #C8F0DA; border-color: var(--merge); }
  .btn-split { background: var(--split-dim); color: #FBDAD2; border-color: var(--split); }

  @media (max-width: 560px) {
    .compare { grid-template-columns: 1fr; }
    .vs { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="eyebrow">Semarang BRT · Data Ops</span>Review Kandidat Merge Halte</h1>
  <div id="count-badge">memuat…</div>
</header>

<main id="list">
  <div class="state-msg">memuat kandidat…</div>
</main>

<script>
const API_LIST = "/api/review";
const API_RESOLVE = "/api/review-resolve";

async function loadQueue() {
  const list = document.getElementById("list");
  const badge = document.getElementById("count-badge");
  try {
    const res = await fetch(API_LIST);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const items = await res.json();

    badge.innerHTML = items.length
      ? `<b>\${items.length}</b> pending`
      : "semua beres";

    if (!items.length) {
      list.innerHTML = `<div class="state-msg">
        <div class="big">Gak ada kandidat yang perlu direview.</div>
        Upload/merge terakhir gak nyisain pasangan ambigu.
      </div>`;
      return;
    }

    list.innerHTML = "";
    for (const item of items) {
      list.appendChild(renderCard(item));
    }
  } catch (err) {
    list.innerHTML = `<div class="state-msg">Gagal memuat: \${err.message}</div>`;
    badge.textContent = "error";
  }
}

function renderCard(item) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-top">
      <div class="metric">
        <span>jarak <b>\${item.distance_m}m</b></span>
        <span>kemiripan nama <b>\${item.name_similarity}</b></span>
      </div>
    </div>
    <div class="compare">
      <div class="halte">
        <div class="nama">\${escapeHtml(item.nama_a)}</div>
        <div class="koridor">Koridor \${escapeHtml(item.koridor_a)}</div>
        <div class="coord">\${item.lat_a}, \${item.lng_a}</div>
      </div>
      <div class="vs">vs</div>
      <div class="halte">
        <div class="nama">\${escapeHtml(item.nama_b)}</div>
        <div class="koridor">Koridor \${escapeHtml(item.koridor_b)}</div>
        <div class="coord">\${item.lat_b}, \${item.lng_b}</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-merge" data-decision="force_merge">Gabungkan — titik yang sama</button>
      <button class="btn-split" data-decision="force_split">Pisahkan — beda titik</button>
    </div>
  `;

  card.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => resolve(item, btn.dataset.decision, card));
  });

  return card;
}

async function resolve(item, decision, card) {
  card.classList.add("resolving");
  try {
    const res = await fetch(API_RESOLVE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        koridorHalteAId: item.koridor_halte_a_id,
        koridorHalteBId: item.koridor_halte_b_id,
        decision,
        resolvedBy: "admin-ui",
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    card.remove();
    loadQueue(); // refresh badge count (dan reload penuh kalau list jadi kosong)
  } catch (err) {
    card.classList.remove("resolving");
    alert("Gagal simpan keputusan: " + err.message);
  }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

loadQueue();
</script>
</body>
</html>
