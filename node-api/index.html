  if (fromVertex == null) {
    fromVertex = lastStopVertex(shape, fromStopName);
    if (fromVertex == null) return null;
    onUpLeg = fromVertex < waybackVertex;
  }

  const legStartName = onUpLeg ? start : wayback;
  const legEndName = onUpLeg ? wayback : end;
  const legStartVertex = onUpLeg ? startVertex : waybackVertex;
  const legEndVertex = onUpLeg ? waybackVertex : endVertex;

  if (toStopName === legEndName) {
    // Natural continuation: this stop's own leg already runs this way —
    // active = the direct remaining stretch of THIS leg; before = the
    // stretch of this same leg already covered since its own start.
    // Sliced directly off the vertex we already resolved above (not by
    // re-looking-up fromStopName by name through getRouteSegment), since
    // for a dual-pole stop that name-based lookup would fall back to
    // lastStopVertex and silently undo the occurrence we just picked.
    const activeSeg = fromVertex <= legEndVertex
      ? shape.coordinates.slice(fromVertex, legEndVertex + 1)
      : shape.coordinates.slice(legEndVertex, fromVertex + 1).reverse();
    const beforeSeg = legStartVertex === fromVertex ? null : (
      legStartVertex <= fromVertex
        ? shape.coordinates.slice(legStartVertex, fromVertex + 1)
        : shape.coordinates.slice(fromVertex, legStartVertex + 1).reverse()
    );
    return { activeSeg, beforeSeg };
  }
  if (toStopName === legStartName) {
    // Going "backward" along this stop's own leg isn't a real bus path —
    // Trans Jogja corridors run one-way — so a stop that offers BOTH
    // onward directions (see stops.json's own destinations list, e.g.
    // Janti Selatan on 1A) has a separate neighboring pole for the
    // destination's leg. findLegEntryStop finds that pole; activeSeg then
    // runs forward from ITS own vertex (not fromStopName's), since that
    // pole's position on the correct leg is what actually matters here.
    const entryStopName = findLegEntryStop(routeId, fromStopName, toStopName);
    if (!entryStopName) {
      // No separate physical pole for this direction — fall back to the
      // direct reverse segment on this stop's own leg, with no "before"
      // (see below: tracing "before" through the wayback point would
      // misrepresent travel that hasn't actually happened).
      const activeSeg = getDirectRouteSegment(routeId, fromStopName, toStopName);
      return activeSeg ? { activeSeg, beforeSeg: null } : null;
    }
    const activeSeg = getRouteSegment(routeId, entryStopName, toStopName);
    if (!activeSeg) return null;
    // "Before" is the entry pole's OWN leg, from ITS start up to the
    // entry pole itself — i.e. what's already been ridden to reach this
    // junction, on the correct leg for the direction actually chosen.
    // Using fromStopName (or the wayback point) here would draw the
    // "backwards" stretch the rider never actually rides for this
    // destination — see the earlier note on this branch.
    const entryLeg = getRouteLegBounds(routeId, entryStopName);
    return {
      activeSeg,
      beforeSeg: entryLeg ? getRouteSegment(routeId, entryLeg.legStartName, entryStopName) : null
    };
  }
  return null;
}

// Finds the specific real neighboring stop — from THIS stop's own
// recorded destinations for this route in stops.json — that leads onto
// the leg ending at toStopName. Used by getJunctionSegments for the
// "other" direction at a junction stop, since that direction is a
// physically separate stop pole rather than the same one-way road
// running backward.
//
// A junction can have more than one recorded destination that resolves
// onto the SAME target leg (e.g. Janti Selatan's 1A destinations include
// both "Ambarukmo - A" and "Janti Utara", and both can sit on the leg
// ending at Malioboro 3). Picking whichever comes first in stops.json
// would arbitrarily skip past a closer, equally-valid entry pole in favor
// of a farther one — so among all matches, this picks the one with the
// LOWEST vertex on that leg, i.e. physically closest to where the leg
// begins, so the highlighted segment starts as near the clicked stop's
// real position as possible.
function findLegEntryStop(routeId, fromStopName, toStopName) {
  const stopEntry = STOPS.find(s => s.name === fromStopName);
  if (!stopEntry) return null;
  const service = stopEntry.services.find(sv => sv.route === routeId);
  if (!service || !Array.isArray(service.destinations)) return null;
  const shape = ROUTE_SHAPES[routeId];
  if (!shape) return null;

  let best = null, bestVertex = Infinity;
  for (const destName of service.destinations) {
    const bounds = getRouteLegBounds(routeId, destName);
    if (!bounds || bounds.legEndName !== toStopName) continue;
    const vertex = lastStopVertex(shape, destName);
    if (vertex == null) continue;
    if (vertex < bestVertex) { bestVertex = vertex; best = destName; }
  }
  return best;
}

// All routes are treated as a two-leg round trip using ROUTE_DIRECTIONS:
// start -> wayback -> end (same physical stop as start). The route shape
// keeps a compatibility `loop` flag only for older files, but the browser
// never uses it for slicing anymore.

// Normalizes whatever shape a route's ./routes/<id>.json file comes in
// (a plain GeoJSON FeatureCollection/Feature/geometry, or the older
// { id, title, color, lines } shape) down to an array of line-string
// coordinate arrays: [[[lon,lat], ...], ...].
function extractLines(raw) {
  // These files wrap the actual GeoJSON in an envelope:
  // { license, description, zoom, latitude, longitude, data: {...} }
  // Unwrap it if present so the logic below can just deal with GeoJSON.
  if (raw && raw.data && typeof raw.data === "object") {
    raw = raw.data;
  }

  // Some route files (e.g. FD3's) carry a top-level `coordinates` array
  // alongside -- and out of sync with -- their `geometry.coordinates`.
  // The top-level array is the one that's kept up to date (it carries
  // FD3's weekend-only extension); `geometry.coordinates` can be a stale
  // leftover. extractShape() and extractOrderedStops() below already
  // prefer this top-level array for exactly that reason -- do the same
  // here, or the always-on base route line silently draws the stale
  // geometry while destination-click highlighting (which goes through
  // extractShape) draws the correct, current one.
  if (Array.isArray(raw.coordinates)) {
    return [raw.coordinates];
  }

  const lines = [];
  const pushGeom = (geom) => {
    if (!geom) return;
    if (geom.type === "LineString") lines.push(geom.coordinates);
    else if (geom.type === "MultiLineString") lines.push(...geom.coordinates);
  };
  if (Array.isArray(raw.lines)) {
    lines.push(...raw.lines);
  } else if (raw.type === "FeatureCollection") {
    (raw.features || []).forEach(f => pushGeom(f.geometry));
  } else if (raw.type === "Feature") {
    pushGeom(raw.geometry);
  } else if (raw.type === "LineString" || raw.type === "MultiLineString") {
    pushGeom(raw);
  }
  return lines;
}

// A "shape" is the directional reference geometry for one route file: a
// single flat coordinate array (segments concatenated end-to-end, assumed
// already ordered along the direction of travel) plus a name -> vertex
// index lookup for any stops the file annotates. This is precomputed
// offline (see build-route-shapes.js) so the browser never has to do
// nearest-point matching at click time — just an array slice.
function extractShape(raw, routeId) {
  if (raw && raw.data && typeof raw.data === "object") raw = raw.data;
  if (!raw || !Array.isArray(raw.stops) || !raw.stops.length) return null;

  const coordinates = Array.isArray(raw.coordinates)
    ? raw.coordinates
    : extractLines(raw).reduce((acc, line) => acc.concat(line), []);
  if (!coordinates.length) return null;

  // Most stop names occur exactly once per route. A few genuinely occur
  // TWICE — not a fork with a separate neighboring pole (that's handled
  // elsewhere via stops.json's own destinations list + findLegEntryStop),
  // but the literal same name at two distinct points, because the route
  // passes the same physical location on both its outbound and return
  // legs (e.g. Ngabean on route 15). A plain Map(name -> vertex) would
  // silently keep only the LAST-written one and lose the other entirely.
  // Storing an array preserves both; see buildStopGraph for the consumer
  // that actually needs every occurrence to build a correct pathfinding
  // graph. Kept sorted ascending so `[0]` is always the earliest visit.
  const stopIndex = new Map();
  raw.stops.forEach(s => {
    if (!s || s.name == null || !Number.isInteger(s.vertex)) return;
    if (!stopIndex.has(s.name)) stopIndex.set(s.name, []);
    stopIndex.get(s.name).push(s.vertex);
  });
  stopIndex.forEach(vertices => vertices.sort((a, b) => a - b));
  if (!stopIndex.size) return null;

  const loop = typeof raw.loop === "boolean" ? raw.loop : false;
  return { coordinates, stopIndex, loop };
}

// Ordered list of { name, coord } along a route's own travel direction —
// unlike extractShape's stopIndex (a name -> vertex Map, which can only
// keep one vertex list per name), this preserves every visit in sequence,
// including a name that legitimately appears twice (e.g. Ngabean on route
// 15's outbound AND return leg). Used to render the route detail panel's
// full ordered stop list.
function extractOrderedStops(raw, lines) {
  if (raw && raw.data && typeof raw.data === "object") raw = raw.data;
  if (!raw || !Array.isArray(raw.stops)) return [];
  const coordinates = Array.isArray(raw.coordinates)
    ? raw.coordinates
    : lines.reduce((acc, line) => acc.concat(line), []);
  return raw.stops
    .filter(s => s && s.name != null && Number.isInteger(s.vertex) && coordinates[s.vertex])
    .sort((a, b) => a.vertex - b.vertex)
    .map(s => ({
      name: s.name,
      coord: coordinates[s.vertex],
      vertex: s.vertex,
      // Only SIBULAN2's two termini currently carry this (see
      // routes/SIBULAN2.json) -- everything else is simply undefined here,
      // which showPopup treats as "no timetable to show".
      ...(Array.isArray(s.departures) && s.departures.length ? { departures: s.departures } : {})
    }));
}

// Directional shapes, keyed by route id, populated by loadRoutes() below.
// { "1A": { coordinates: [[lon,lat],...], stopIndex: Map(name -> vertex), loop: bool } }
const ROUTE_SHAPES = {};
window.ROUTE_SHAPES = ROUTE_SHAPES; // debug: cek di console via Object.keys(ROUTE_SHAPES).length

// Raw line geometry per route id (array of coordinate arrays), populated
// by loadRoutes() below. Used to fit the map to every serving route's
// full extent when showing a stop's "all routes" overview.
const ROUTE_LINES = {};

// Ordered stop lists per route id (see extractOrderedStops above),
// populated by loadRoutes() below. Feeds the route detail panel.
const ROUTE_ORDERED_STOPS = {};

// Ported from the Surabaya build: that project had FD3, a route with a
// weekday file and a separate weekend file (swapped by routeFileFor based
// on the day). No Yogyakarta route uses that swap-the-whole-file pattern,
// so that machinery isn't ported here.
//
// SIBULAN1/SIBULAN2 (weekday-only school buses) need a DIFFERENT pattern
// instead: a single route file, dimmed-not-swapped on non-operating days.
// Not wired up yet — see AUDIT-YOGYAKARTA.md for why (missing stop data
// for both routes' termini). When that data exists, this is the spot to
// add an `isRouteActiveToday(id)` helper reading `ROUTE_META[id].schedule`,
// plus a dimming pass in setRouteDimming/setRouteOverview's reset branches
// so inactive routes default to dimmed instead of full color.

function routeFileFor(id) {
  return `${id}.json`;
}

// Routes marked "weekday-only" in ROUTE_META (SIBULAN1/SIBULAN2) render
// dimmed by default on non-operating days -- not hidden, just visually
// deprioritized, distinct from the heavier grey/0.05 treatment used for
// interactive de-selection below. This only affects the BASELINE state:
// any interactive highlight (hover, click, route detail) still fully
// overrides it, since that grey/0.05 treatment is strictly more dimmed
// than this and only ever applies to routes not in the highlighted set.
function isRouteActiveToday(id) {
  const schedule = ROUTE_META[id] && ROUTE_META[id].schedule;
  if (!schedule || schedule.type !== "weekday-only") return true;
  const day = new Date().getDay(); // 0 = Sunday, 6 = Saturday
  return day >= 1 && day <= 5;
}

const INACTIVE_TODAY_IDS = ROUTE_IDS.filter(id => !isRouteActiveToday(id));
const BASELINE_ROUTE_COLOR = INACTIVE_TODAY_IDS.length
  ? ["case", ["in", ["get", "id"], ["literal", INACTIVE_TODAY_IDS]], "#b5b3ad", ["get", "color"]]
  : ["get", "color"];
const BASELINE_ROUTE_OPACITY = INACTIVE_TODAY_IDS.length
  ? ["case", ["in", ["get", "id"], ["literal", INACTIVE_TODAY_IDS]], 0.35, 0.9]
  : 0.9;

async function loadRoutes() {
  const results = await Promise.allSettled(
    ROUTE_IDS.map(id =>
      fetch(`./routes/${routeFileFor(id)}`)
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(raw => {
          const lines = extractLines(raw);
          return {
            id,
            title: ROUTE_META[id].title,
            color: ROUTE_META[id].color,
            lines,
            shape: extractShape(raw, id),
            orderedStops: extractOrderedStops(raw, lines)
          };
        })
    )
  );

  const routes = [];
  results.forEach((res, i) => {
    if (res.status === "fulfilled" && res.value.lines.length) {
      routes.push(res.value);
      if (res.value.shape) ROUTE_SHAPES[res.value.id] = res.value.shape;
      ROUTE_LINES[res.value.id] = res.value.lines;
      ROUTE_ORDERED_STOPS[res.value.id] = res.value.orderedStops;
    } else {
      console.warn(`Could not load route ${ROUTE_IDS[i]}:`, res.reason || "no line geometry found");
    }
  });
  return routes;
}

// ---- 2. Map setup -------------------------------------------------------
const PROTOMAPS_API_KEY = "ed3acf093a24c3f4"; // https://protomaps.com — free for non-commercial use

if (PROTOMAPS_API_KEY === "YOUR_API_KEY_HERE") {
  document.getElementById("keybanner").style.display = "block";
}

// Kick these off immediately, in parallel with the basemap's own tile/style
// requests, instead of waiting for the map "load" event. By the time the
// map is ready to receive layers, this data has often already arrived —
// turning what used to be a serial "map loads, then data loads" chain into
// one parallel network burst.
const stopsPromise = loadStops();
const routesPromise = loadRoutes();

// ?cartography=1 marks this page as loaded inside cartography.html's
// same-origin iframe (see the Cartography embed hooks further down) --
// preserveDrawingBuffer is only worth the extra memory/perf cost there,
// where the canvas needs to survive being captured for print/export.
const CARTOGRAPHY_EMBED = new URLSearchParams(location.search).get("cartography") === "1";
// The normal app eases fitBounds over half a second so panning/zooming
// reads as a smooth camera move. In the editor that's actively harmful:
// cartography.html calls fitBounds again every time the page size,
// orientation, or selected stop changes, and a screenshot/print taken
// mid-ease lands on some arbitrary in-between framing rather than the
// intended one -- exactly the "unnaturally cropped/zoomed" look. Embed
// mode always snaps straight to the final framing instead.
const FIT_DURATION = CARTOGRAPHY_EMBED ? 0 : 500;

const map = new maplibregl.Map({
  container: "map",
  style: `https://api.protomaps.com/styles/v5/light/en.json?key=${PROTOMAPS_API_KEY}`,
  center: [110.397, -7.038], // Semarang -- computed from actual halte_master bounding box (Mangkang ke Ungaran/Genuk), was Yogyakarta's [110.390, -7.786]
  zoom: 10.4, // span ~0.18 lat x 0.21 lng dari data halte asli; adjust if it feels off
  preserveDrawingBuffer: CARTOGRAPHY_EMBED,
});
window.map = map; // exposed for cartography.html, which drives this map directly (same-origin iframe)
if (CARTOGRAPHY_EMBED) document.body.classList.add("cartography-embed");

// Non-interactive label that follows the cursor while hovering a stop
// dot (see the "stops-circle" mousemove handler below) -- separate from
// the click popup instance further down, which opens the full "Stop
// information" card instead.
const stopHoverPopup = new maplibregl.Popup({
  closeButton: false, closeOnClick: false, className: "stop-tooltip", offset: 10
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

// Trip-planner stop tags (board/transfer/alight) are full-size HTML cards
// so they stay razor sharp at any zoom, but that means they DON'T shrink
// as the map zooms out — left unchecked they end up overlapping and
// covering most of the visible map. Below this zoom level we swap every
// plan marker over to a small compact pin (see .plan-marker-compact CSS
// and body.zoomed-out rules) instead of the full detail card.
const PLAN_MARKER_COMPACT_ZOOM = 13;
function syncPlanMarkerZoomState() {
  document.body.classList.toggle("zoomed-out", map.getZoom() < PLAN_MARKER_COMPACT_ZOOM);
}
map.on("zoom", syncPlanMarkerZoomState);

// Re-measures the map against its container's CURRENT pixel size and
// re-frames the given stop's "Show final destination" view to match --
// cartography.html calls this after every page-size/orientation change
// (the iframe's box just resized) so the view always fits the paper
// dimensions actually being designed for, rather than staying framed for
// whatever size happened to be active when the stop was first picked.
window.refitStop = function (stopName) {
  map.resize();
  if (stopName) window.showFinalDestinationsForStop(stopName);
};

// Every cartography.html style hook below funnels its map.setLayoutProperty
// / setPaintProperty calls through these instead of calling them directly.
// Reasoning: these hooks run several property updates back to back, and
// MapLibre throws on some property/value combinations rather than
// warning (e.g. passing a layer-level field like "minzoom" to
// setLayoutProperty, which only accepts actual layout properties). An
// uncaught throw partway through one hook was aborting everything AFTER
// it too -- not just the rest of that hook, but every subsequent line in
// whichever cartography.html callback triggered it, including the pill
// list refresh, legend, drag-mode sync, and the safety-net refit. Isolating
// each property write means one bad one degrades gracefully instead of
// silently breaking unrelated features downstream.
function safeSetLayout(layerId, name, value) {
  try { map.setLayoutProperty(layerId, name, value); }
  catch (err) { console.warn(`[cartography] setLayoutProperty(${layerId}, "${name}") failed:`, err); }
}
function safeSetPaint(layerId, name, value) {
  try { map.setPaintProperty(layerId, name, value); }
  catch (err) { console.warn(`[cartography] setPaintProperty(${layerId}, "${name}") failed:`, err); }
}

// Applied once, right after the map finishes loading in embed mode: pushes
// the route line and stop dots toward the plain, thin-lined "printed
// transit poster" look cartography.html is modeled on (a Sydney bus-stop
// wayfinding panel) -- thin solid strands, small hollow-ring stop dots,
// no glow halo, no direction arrows -- rather than the live app's
// thicker, glow-and-arrow interactive style, which reads as too busy and
// is also what was causing bundled/parallel legs to look tangled instead
// of cleanly side by side.
function applyCartographyMapStyle() {
  ["active-segment-arrows", "before-segment-arrows", "route-direction-arrows"].forEach(id => {
    if (!map.getLayer(id)) return;
    safeSetLayout(id, "visibility", "none");
    safeSetPaint(id, "icon-opacity", 0); // belt-and-suspenders alongside visibility:none
  });
  safeSetPaint("active-segment-glow", "line-opacity", 0);
  safeSetPaint("active-segment-line", "line-width", 4);
  safeSetPaint("before-segment-line", "line-width", 3);
  safeSetPaint("stops-circle", "circle-radius",
    ["interpolate", ["linear"], ["zoom"], 8, 3, 12, 4.5, 15, 6]);
  safeSetPaint("stops-circle", "circle-color", "#ffffff");
  safeSetPaint("stops-circle", "circle-stroke-color",
    ["case", ["get", "inactive"], "#9aa0a6", "#1a2b4c"]);
  safeSetPaint("stops-circle", "circle-stroke-width", 2.5);
}

// bundleSegments' lane offset is now baked directly into each run's real
// coordinates (see offsetPolylineMeters) rather than a paint-time pixel
// shift, so -- unlike the old approach -- it needs redoing whenever the
// zoom actually changes, or a lane spaced correctly for one zoom will
// read as too wide/narrow at another. setActiveSegment/setBeforeSegment
// cache their last raw input specifically so this can just replay them.
if (CARTOGRAPHY_EMBED) {
  map.on("zoomend", () => {
    if (lastActiveSegmentsInput && (Array.isArray(lastActiveSegmentsInput)
      ? lastActiveSegmentsInput.length : lastActiveSegmentsInput.coords)) {
      setActiveSegment(lastActiveSegmentsInput);
    }
    if (lastBeforeSegmentsInput && (Array.isArray(lastBeforeSegmentsInput)
      ? lastBeforeSegmentsInput.length : lastBeforeSegmentsInput.coords)) {
      setBeforeSegment(lastBeforeSegmentsInput);
    }
  });
}

map.on("load", async () => {
  const [loadedStops, ROUTES] = await Promise.all([stopsPromise, routesPromise]);
  STOPS = loadedStops;
  window.STOPS = STOPS; // exposed for cartography.html's own stop search
  initSearch();

  const routeGeoJSON = {
    type: "FeatureCollection",
    features: ROUTES.flatMap(r => r.lines.map(line => ({
      type: "Feature",
      geometry: { type: "LineString", coordinates: line },
      properties: { id: r.id, title: r.title, color: r.color }
    })))
  };

  map.addSource("route", { type: "geojson", data: routeGeoJSON });
  map.addLayer({
    id: "route-line",
    type: "line",
    source: "route",
    paint: {
      "line-color": BASELINE_ROUTE_COLOR,
      "line-width": 4,
      "line-opacity": BASELINE_ROUTE_OPACITY,
      // Without this, MapLibre's default ~300ms paint-property transition
      // means every setPaintProperty below doesn't apply instantly -- it
      // fades from whatever was on screen a moment ago. showPopup resets
      // dimming to "normal" and syncRouteDetailSelection immediately
      // re-dims it in the same tick, so the net change SHOULD be
      // invisible, but with the transition engaged the renderer still
      // restarts a fade from the briefly-normal state, so the previously
      // dimmed routes visibly flash back to full color and slowly fade
      // out again instead of just staying dimmed. Instant application
      // avoids that flash entirely.
      "line-color-transition": { duration: 0 },
      "line-opacity-transition": { duration: 0 }
    }
  });


  // Direction arrows: your arrow.svg, marching along a route's own line,
  // oriented to the line's local bearing. This reads direction straight
  // off `line`'s own coordinate order — the same "already ordered along
  // the actual direction of travel" contract build-route-shapes.js
  // already assumes (see its top-of-file comment) — so it can't drift
  // out of sync with the up/down leg logic elsewhere; there's no
  // separate direction data to maintain.
  //
  // Loaded as an SDF icon (sdf: true) specifically so `icon-color` can
  // recolor it per-feature at paint time — one icon image, tinted to
  // match whichever route it's drawn on via that route's own `color`
  // property (already on every "route" source feature), instead of
  // needing a separate baked icon per route color.
  //
  // Hidden for every route by default (filter matches no real route id) —
  // with every route drawn at once, arrows on all of them read as clutter
  // rather than direction info. setRouteArrows() below turns them on only
  // for whichever route(s) are currently highlighted (a destination pick,
  // or the "Stop information" overview), matching setRouteDimming /
  // setRouteOverview's own scope exactly.
  const ARROW_ICON_WIDTH = 32;

  // Rasterizes an SVG file into image data sized for use as a map icon,
  // preserving its own aspect ratio (arrow.svg's viewBox is wider than
  // tall, so forcing it into a square would squash the arrowhead).
  async function loadSvgIcon(path, targetWidth) {
    const svgText = await (await fetch(path)).text();
    const url = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));
    try {
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });
      const aspect = (img.naturalWidth && img.naturalHeight) ? img.naturalHeight / img.naturalWidth : 0.5;
      const w = targetWidth, h = Math.max(1, Math.round(targetWidth * aspect));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      return ctx.getImageData(0, 0, w, h);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  let arrowIcon;
  try {
    arrowIcon = await loadSvgIcon("./src/arrow.svg", ARROW_ICON_WIDTH);
  } catch (err) {
    // Fall back to a plain solid triangle (still SDF, still tintable) if
    // arrow.svg isn't there yet, so a missing/renamed file doesn't take
    // the whole map down — just loses the custom arrow shape.
    console.warn("Couldn't load ./src/arrow.svg, using a plain triangle instead.", err);
    const w = ARROW_ICON_WIDTH, h = Math.round(w * 0.5);
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.moveTo(w * 0.1, h * 0.1);
    ctx.lineTo(w * 0.95, h * 0.5);
    ctx.lineTo(w * 0.1, h * 0.9);
    ctx.closePath();
    ctx.fill();
    arrowIcon = ctx.getImageData(0, 0, w, h);
  }
  map.addImage("route-arrow", arrowIcon, { sdf: true });

  // Shared by every arrow layer (base route, before-segment, active-segment)
  // so all three stay visually identical and only need tuning in one place.
  const ARROW_LAYOUT = {
    "symbol-placement": "line",
    "symbol-spacing": 90,
    "icon-image": "route-arrow",
    "icon-size": ["interpolate", ["linear"], ["zoom"], 13, 0.55, 18, 1.1],
    "icon-rotation-alignment": "map",
    // Per the MapLibre spec, icon-offset is applied in the icon's OWN
    // (rotated) frame, not the map's — so a fixed Y offset here shifts
    // the arrow consistently to one side of the line at every point,
    // however the line bends, instead of sitting directly on top of it.
    "icon-offset": [0, 15],
    "icon-allow-overlap": true,
    "icon-ignore-placement": true,
    // Without this, MapLibre "corrects" icons that would render upside
    // down back to right-side up — which is exactly wrong for a
    // direction arrow on a line heading the "other" way.
    "icon-keep-upright": false
  };
  // arrow.svg's arrowhead points toward the shape's own negative-X side
  // (left), but MapLibre's line-placement rotation assumes an icon's
  // un-rotated artwork points the opposite way — without this, every
  // arrow renders pointing exactly backward along its line.
  const ARROW_ROTATE = 180;
  const ARROW_PAINT = {
    // SDF tint: colors the icon using each feature's own route color
    // instead of one fixed color for every route's arrows.
    "icon-color": ["get", "color"],
    // Outline so the arrow stays readable against the basemap even for
    // lighter route colors (and against the route's own line, since the
    // offset above can still land it partly over other map detail).
    "icon-halo-color": "#ffffff",
    "icon-halo-width": 1.2,
    "icon-halo-blur": 0.3
  };

  map.addLayer({
    id: "route-direction-arrows",
    type: "symbol",
    source: "route",
    filter: ["==", ["get", "id"], "__none__"],
    layout: { ...ARROW_LAYOUT, "icon-rotate": ARROW_ROTATE },
    paint: ARROW_PAINT
  });

  // Trip-planner overlay: a bold, glowing line drawn on top of everything
  // else for the currently-found multi-route path (see findStopPath /
  // buildItinerary below). Each leg is its own Feature so it can carry
  // its own route's color — a transfer between two routes just means two
  // adjacent Features with different `color` properties.
  map.addSource("planned-route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "planned-route-glow",
    type: "line",
    source: "planned-route",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: {
      "line-color": "#ffffff",
      "line-width": ["interpolate", ["linear"], ["zoom"], 10, 10, 15, 9],
      "line-opacity": 0.95
    }
  });
  map.addLayer({
    id: "planned-route-line",
    type: "line",
    source: "planned-route",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: {
      "line-color": ["get", "color"],
      "line-width": ["interpolate", ["linear"], ["zoom"], 10, 6, 15, 5],
      "line-opacity": 1
    }
  });

  map.addSource("stops", { type: "geojson", data: buildStopsGeoJSON() });

  // Empty at first; populated on demand by selectRouteDetailStop() /
  // applyRouteDetailLeg() (route detail panel) and highlightRouteToHubLoop()
  // when someone taps a "→ destination" line in a stop's popup. Sits
  // BELOW active-segment so the highlighted leg draws on top of it where
  // they meet.
  map.addSource("before-segment", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "before-segment-line",
    type: "line",
    source: "before-segment",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: {
      "line-color": ["get", "color"],
      "line-width": 4,
      "line-opacity": 0.6
    }
  });
  // Arrows for the dimmed "before" leg. No filter needed — this source
  // only ever holds the current selection's own before-leg (or nothing),
  // so it's naturally empty except when a destination is actually picked.
  map.addLayer({
    id: "before-segment-arrows",
    type: "symbol",
    source: "before-segment",
    layout: { ...ARROW_LAYOUT, "icon-rotate": ARROW_ROTATE },
    paint: { ...ARROW_PAINT, "icon-opacity": 0.6 }
  });

  // Empty at first; populated on demand by selectRouteDetailStop() /
  // applyRouteDetailLeg() (route detail panel) and highlightRouteToHubLoop()
  // when someone taps a "→ destination" line in a stop's popup.
  map.addSource("active-segment", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "active-segment-glow",
    type: "line",
    source: "active-segment",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#ffffff", "line-width": 9, "line-opacity": 0.9 }
  });
  map.addLayer({
    id: "active-segment-line",
    type: "line",
    source: "active-segment",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: {
      "line-color": ["get", "color"],
      "line-width": 5,
      "line-opacity": 1
    }
  });
  // Arrows for the solid "active" leg — the destination-click counterpart
  // to route-direction-arrows. Deliberately a SEPARATE layer/source from
  // the base route arrows rather than just filtering the full route line
  // down to this route's id: that would still draw arrows along the
  // route's ENTIRE shape (including the stretch beyond wherever this
  // specific trip actually ends), not just this before/active selection.
  map.addLayer({
    id: "active-segment-arrows",
    type: "symbol",
    source: "active-segment",
    layout: { ...ARROW_LAYOUT, "icon-rotate": ARROW_ROTATE },
    paint: ARROW_PAINT
  });

  map.addLayer({
    id: "stops-circle",
    type: "circle",
    source: "stops",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 1.5, 10, 2.5, 13, 5, 15, 8],
      "circle-color": ["case", ["get", "inactive"], "#9aa0a6", "#E73D4A"],
      "circle-opacity": ["case", ["get", "inactive"], 0.45, 1],
      "circle-stroke-width": 2,
      "circle-stroke-color": "#ffffff",
      "circle-stroke-opacity": ["case", ["get", "inactive"], 0.6, 1]
    }
  });

  // Stop-name labels: hidden until you're zoomed in close enough that
  // they'd actually be legible/uncluttered (matching how Google/Citymapper
  // only label individual stops once you're at street level), then fade
  // in rather than popping. "label" is a precomputed displayName() string
  // baked into the geojson (see buildStopsGeoJSON) since a style
  // expression can't call an arbitrary JS function at render time.
  // Shares the "stops" source with stops-circle, so setStopsFilter/
  // setStopsFilterByNames/setStopsPassedNames all keep this in sync with
  // whichever dots are currently shown/highlighted (see STOPS_LAYER_IDS).
  map.addLayer({
    id: "stops-label",
    type: "symbol",
    source: "stops",
    minzoom: 14,
    layout: {
      "text-field": ["get", "label"],
      "text-font": ["Noto Sans Medium"],
      "text-size": 11,
      "text-anchor": "left",
      "text-offset": [0.7, 0],
      "text-max-width": 8,
      "text-optional": true
    },
    paint: {
      "text-color": ["case", ["get", "inactive"], "#9aa0a6", "#c1272d"],
      "text-halo-color": "#ffffff",
      "text-halo-width": 1.4,
      "text-opacity": ["interpolate", ["linear"], ["zoom"], 14, 0, 15, 1]
    }
  });

  // The trip-planner overlay was added earlier (before stops-circle), which
  // means the paint order stacked every individual stop dot ON TOP of it —
  // in a corridor with lots of closely-spaced stops, that dense cluster of
  // opaque circles could visually swallow the thin line running underneath,
  // making the route look like it's not there at all. Move it back to the
  // very top so the bold planned path is never hidden behind stop markers.
  map.moveLayer("planned-route-glow");
  map.moveLayer("planned-route-line");

  // Highlights whichever single stop is currently open (popup or the
  // docked "Stop information" panel) so it's obvious which dot on the
  // map the card in front of you belongs to. Empty at first, populated
  // on demand by setSelectedStop() -- same empty-source-until-needed
  // pattern as active-segment/before-segment above. Added last (no
  // beforeId) so it always paints on top of every stop dot, including
  // the planned-route lines just re-raised above.
  map.addSource("selected-stop", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({
    id: "selected-stop-halo",
    type: "circle",
    source: "selected-stop",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 10, 10, 14, 13, 22, 15, 30],
      "circle-color": "#3a66cf",
      "circle-opacity": 0.22,
      "circle-stroke-width": 0
    }
  });
  map.addLayer({
    id: "selected-stop-ring",
    type: "circle",
    source: "selected-stop",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 4, 10, 6.5, 13, 11, 15, 16],
      "circle-color": "#E73D4A",
      "circle-stroke-width": 3.5,
      "circle-stroke-color": "#ffffff"
    }
  });

  map.on("mouseenter", "stops-circle", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "stops-circle", () => {
    map.getCanvas().style.cursor = "";
    stopHoverPopup.remove();
  });
  // mousemove (not mouseenter) so the tooltip keeps re-targeting as the
  // cursor drifts across adjacent/overlapping stop dots without ever
  // leaving the layer's hit area -- mouseenter only fires once on
  // entering the layer as a whole, not per-feature.
  map.on("mousemove", "stops-circle", (e) => {
    const f = e.features[0];
    if (!f || window.pickMode) return; // don't clutter the map while picking a planner stop
    stopHoverPopup.setLngLat(f.geometry.coordinates).setHTML(stopTitleHtml(f.properties.name)).addTo(map);
  });

  map.on("click", "stops-circle", (e) => {
    const f = e.features[0];
    if (window.pickMode) {
      setPlanStop(window.pickMode, f.properties.name);
      window.pickMode = null;
      document.querySelectorAll(".pick-btn").forEach(b => b.classList.remove("active"));
      return;
    }
    let services = f.properties.services;
    try { services = JSON.parse(services); } catch (err) { services = []; }
    showPopup(f.geometry.coordinates, f.properties.name, services);
  });

  // Clears a "-> destination" quick-pick highlight (see
  // highlightRouteToDestination / highlightRouteToHubLoop and
  // quickDestinationPickActive above) when the user clicks anywhere else
  // on the map that isn't a stop marker -- previously the only way to
  // dismiss that badge was closing the stop popup, but those two now
  // close the popup themselves as soon as they run, so nothing was left
  // to clear it and it just sat there covering the map. Skipped when a
  // stop marker was actually clicked since the "click","stops-circle"
  // handler above already does its own full reset via showPopup.
  map.on("click", (e) => {
    if (!quickDestinationPickActive) return;
    const hitStop = map.queryRenderedFeatures(e.point, { layers: ["stops-circle"] }).length > 0;
    if (hitStop) return;
    clearDestLabels();
    setActiveSegment(null);
    setBeforeSegment(null);
    setRouteDimming(null);
    setStopsFilter(null);
    setSelectedStop(null);
  });

  buildStopGraph();
  applyHash();

  // ---- Cartography embed mode --------------------------------------
  // If loaded inside cartography.html's iframe with a stop pre-selected
  // (cartography.html passes it via ?stop=), replicate the "Show final
  // destination" view for it immediately. Fires a "cartography:ready"
  // event either way so cartography.html knows it's now safe to call
  // window.showFinalDestinationsForStop / window.setStopLabelStyle / etc.
  if (CARTOGRAPHY_EMBED) {
    applyCartographyMapStyle();
    const initialStop = new URLSearchParams(location.search).get("stop");
    if (initialStop) window.refitStop(initialStop);
  }
  window.cartographyReady = true; // polled by cartography.html in case it attaches its listener late
  window.dispatchEvent(new CustomEvent("cartography:ready"));
});

// Slices a route's precomputed shape between two named stops. Returns the
// coordinate array to draw, or null if either stop isn't in that route's
// shape (e.g. the route file hasn't been enriched with vertex data yet).
function getRouteVertex(routeId, stopName, preferEndVertex = false, preferStartVertex = false) {
  const shape = ROUTE_SHAPES[routeId];
  if (!shape) return null;
  const lv = getRouteLegVertices(routeId);
  // Mirrors the preferEndVertex check just below: when a name is being
  // resolved specifically as a LEG'S OWN START boundary (see getRouteSegment
  // and getJunctionSegments, which pass legStartName here), and that name
  // happens to be the route's declared start, it means "the literal
  // beginning of the shape" — not whatever lastStopVertex would return.
  // Without this, a route whose start stop is revisited mid-route (R5's
  // "Terminal Benowo") draws its "before" segment from the WRONG occurrence
  // of that name, producing a segment that spans almost the entire loop
  // instead of the short stretch from vertex 0 to the clicked stop.
  if (preferStartVertex && lv && stopName === lv.start && lv.startVertex != null) {
    return lv.startVertex;
  }
  if (preferEndVertex && lv && stopName === lv.end && lv.endVertex != null) {
    return lv.endVertex;
  }
  const explicitVertex = lastStopVertex(shape, stopName);
  if (explicitVertex != null) return explicitVertex;
  if (lv && stopName === lv.end && lv.endVertex != null) return lv.endVertex;
  return null;
}

function getRouteSegment(routeId, fromStopName, toStopName) {
  const shape = ROUTE_SHAPES[routeId];
  if (!shape) return null;
  const a = getRouteVertex(routeId, fromStopName, false, true);
  const b = getRouteVertex(routeId, toStopName, true);
  if (a == null || b == null) return null;
  if (a <= b) return shape.coordinates.slice(a, b + 1);
  return shape.coordinates.slice(b, a + 1).reverse();
}

// Like getRouteSegment, but it never wraps around a seam — it just retraces
// the straight stretch of road between the two stops, backward if needed.
// Used for junction stops where a rider can head toward an earlier waypoint
// than their current position.
function getDirectRouteSegment(routeId, fromStopName, toStopName) {
  const shape = ROUTE_SHAPES[routeId];
  if (!shape) return null;
  const a = getRouteVertex(routeId, fromStopName, false, true);
  const b = getRouteVertex(routeId, toStopName, true);
  if (a == null || b == null) return null;
  return a <= b ? shape.coordinates.slice(a, b + 1) : shape.coordinates.slice(b, a + 1).reverse();
}

// Both accept either a single {coords,color} pair (the original, still
// used by highlightRouteToDestination/highlightRouteToHubLoop for one
// route at a time) or an ARRAY of them (used by
// showFinalDestinationsForStop to draw every one of a stop's routes'
// onward legs at once, each in its own color) -- setData just takes
// however many features come out the other end.
// Gap between parallel lanes (in px) when two or more segments below turn
// out to travel the exact same stretch of road at once -- matches the
// reference wayfinding posters' "shared corridor drawn as side-by-side
// colored strands" look instead of one line hiding the others under it.
// Only ever used in cartography embed mode (see bundleSegments' early
// return below), so this is tuned against applyCartographyMapStyle's thin
// 4px active-segment-line width, not the live app's default one.
const LANE_OFFSET_PX = 6;
// Same convention Affinity/most vector editors use for a contour/outline
// tool's miter limit: beyond this, a sharp turn's true miter point would
// shoot out unreasonably far, so it's clamped and the join falls back to
// a plain bevel instead of spiking.
const LANE_MITER_LIMIT = 4;
// How far apart (in meters) two routes' paths can run and still count as
// "the same road" for bundling purposes, and the spacing between the
// comparison points used to test that. Real one-way street couplets are
// reliably farther apart than this; two independently-digitized traces of
// the literal same street are reliably closer.
const COINCIDENCE_THRESHOLD_M = 12;
const RESAMPLE_STEP_M = 12;

// Local flat-meters projection anchored at a reference latitude -- only
// ever used to offset/compare routes within a single small area (one
// stop's onward legs), which never spans enough latitude for the
// Mercator distortion this ignores to matter, but makes all the geometry
// below plain 2D vector math instead of sphere math.
const EARTH_R = 6378137;
function toLocalXY([lon, lat], refLat) {
  const rad = Math.PI / 180;
  return [lon * rad * EARTH_R * Math.cos(refLat * rad), lat * rad * EARTH_R];
}
function toLonLat([x, y], refLat) {
  const rad = Math.PI / 180;
  return [x / (EARTH_R * Math.cos(refLat * rad)) / rad, y / EARTH_R / rad];
}
// Web Mercator ground resolution formula -- how many real-world meters one
// screen pixel covers at a given zoom/latitude. Used to convert
// "N pixels apart on screen" into an actual meters offset to bake into
// the line's real coordinates.
function metersPerPixelAt(lat, zoom) {
  return (156543.03392 * Math.cos(lat * Math.PI / 180)) / Math.pow(2, zoom);
}

// Re-walks `ptsXY` (local meters) and drops a point every `stepMeters`
// along its length, regardless of where the original vertices fell.
// Needed because two independently-digitized traces of the same street
// almost never share vertex positions (different source, different
// simplification) -- resampling both to a common, regular spacing is what
// makes a proximity comparison between them meaningful point-for-point.
function resampleXY(ptsXY, stepMeters) {
  if (ptsXY.length < 2) return ptsXY.slice();
  const out = [ptsXY[0]];
  let prev = ptsXY[0];
  let carry = 0;
  for (let i = 1; i < ptsXY.length; i++) {
    let cur = ptsXY[i];
    let segLen = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
    while (segLen > 1e-9 && carry + segLen >= stepMeters) {
      const t = (stepMeters - carry) / segLen;
      const pt = [prev[0] + (cur[0] - prev[0]) * t, prev[1] + (cur[1] - prev[1]) * t];
      out.push(pt);
      prev = pt;
      segLen = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
      carry = 0;
    }
    carry += segLen;
    prev = cur;
  }
  out.push(ptsXY[ptsXY.length - 1]);
  return out;
}

// True polyline offset -- the same operation as a vector editor's
// contour/outline-expand tool (see the Affinity Designer panel this is
// modeled on): walk the line, offset each vertex perpendicular to the
// line's own local direction, miter-joining consecutive offset segments
// back together at each interior vertex. `offset` can be a single number
// (every point shifts the same amount) or an array with one value per
// point in `ptsXY` (each point shifts by its own amount) -- bundleSegments
// below always uses the array form, so a leg that's shared with another
// route for part of its length and solo for the rest stays ONE unbroken
// line whose sideways offset just tapers to zero, rather than being cut
// into separate pieces that don't quite meet back up.
function offsetPolylineXY(ptsXY, offset) {
  if (ptsXY.length < 2) return ptsXY.slice();
  const offsetAt = Array.isArray(offset) ? (i => offset[i]) : (() => offset);
  const unitNormal = (a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    return [-dy / len, dx / len]; // 90° left of travel direction
  };
  return ptsXY.map((p, i) => {
    let nx, ny;
    if (i === 0) {
      [nx, ny] = unitNormal(ptsXY[0], ptsXY[1]);
    } else if (i === ptsXY.length - 1) {
      [nx, ny] = unitNormal(ptsXY[i - 1], ptsXY[i]);
    } else {
      const [n1x, n1y] = unitNormal(ptsXY[i - 1], ptsXY[i]);
      const [n2x, n2y] = unitNormal(ptsXY[i], ptsXY[i + 1]);
      let mx = n1x + n2x, my = n1y + n2y;
      const mLen = Math.hypot(mx, my);
      if (mLen < 1e-6) { [nx, ny] = [n1x, n1y]; } // ~180° reversal: normals cancel, just use one
      else {
        mx /= mLen; my /= mLen;
        const cosHalf = mx * n1x + my * n1y; // = cos(half the turn angle)
        const scale = Math.min(1 / Math.max(cosHalf, 1e-6), LANE_MITER_LIMIT);
        nx = mx * scale; ny = my * scale;
      }
    }
    const off = offsetAt(i);
    return [p[0] + nx * off, p[1] + ny * off];
  });
}

// Averages each value in `values` with its `radius` neighbors on either
// side. Applied to the raw per-point lane offsets below so a leg's
// sideways shift ramps smoothly in and out over a short stretch instead
// of snapping straight from 0 to full width the instant it starts/stops
// running alongside another route -- reads as a natural diagonal
// merge/peel-off rather than a sudden kink.
function smoothValues(values, radius) {
  return values.map((_, i) => {
    let sum = 0, count = 0;
    for (let k = -radius; k <= radius; k++) {
      const j = i + k;
      if (j >= 0 && j < values.length) { sum += values[j]; count++; }
    }
    return sum / count;
  });
}

// Figures out, for every segment in `segments` (already-valid
// {coords,color,...} objects, each a single LineString), how far
// sideways to shift each of its points so that wherever it runs
// alongside another segment the two sit in clean parallel lanes instead
// of overlapping -- and returns ONE continuous offset LineString per
// input segment (never split into pieces: see offsetPolylineXY's array
// form above for why that matters).
//
// Detection is PROXIMITY-based, not exact-vertex-matching: every segment
// gets resampled to a common point spacing (resampleXY), and a spatial
// hash of every segment's resampled points lets each point cheaply find
// any other segment's point within COINCIDENCE_THRESHOLD_M of it. Exact
// matching only ever caught segments that happened to share literal
// digitized vertices, which two independently-traced lines along the same
// real street essentially never do -- proximity is what actually
// recognizes "these are the same road" in practice.
//
// Direction-aware: at each matched point pair, local travel direction
// (tangent) is compared between the two segments. A route sharing the
// road but digitized/traveling the opposite way still gets a consistent,
// non-crossing lane assignment, because its rank's sign gets flipped to
// compensate for its naturally-mirrored offset normal.
//
// Gated to cartography.html's embed mode: the live app's own
// click-to-explore views weren't designed around this and shouldn't
// change shape underneath existing users.
function bundleSegments(segments) {
  if (!CARTOGRAPHY_EMBED || segments.length < 2) return segments.slice();
  const zoom = map.getZoom();

  // One shared reference latitude for every segment in this call -- all
  // of them need to land in the SAME local-meters frame for a distance
  // between two different segments' points to mean anything (each
  // segment picking its own midpoint latitude, as offsetPolylineXY's
  // caller does elsewhere, only works for offsetting a segment against
  // itself).
  const allLats = segments.flatMap(s => s.coords.map(c => c[1]));
  const refLat = allLats.reduce((a, b) => a + b, 0) / allLats.length;

  const resampled = segments.map(s => resampleXY(s.coords.map(c => toLocalXY(c, refLat)), RESAMPLE_STEP_M));

  // Spatial hash: cell -> [{si, pi}] for every resampled point, so a
  // proximity lookup only has to check nearby cells instead of every
  // other point in the whole selection.
  const grid = new Map();
  const cellOf = (p) => `${Math.floor(p[0] / COINCIDENCE_THRESHOLD_M)},${Math.floor(p[1] / COINCIDENCE_THRESHOLD_M)}`;
  resampled.forEach((pts, si) => {
    pts.forEach((p, pi) => {
      const key = cellOf(p);
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push({ si, pi });
    });
  });

  const tangentAt = (pts, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    return [dx / len, dy / len];
  };

  // membership[si][pi] = every segment (including si itself) with a point
  // within COINCIDENCE_THRESHOLD_M of this exact point, each tagged with
  // whether it's traveling the same local direction here.
  const membership = resampled.map(() => []);
  resampled.forEach((pts, si) => {
    pts.forEach((p, pi) => {
      const members = [{ si, sameDir: true }];
      const seenOther = new Set();
      const [cx, cy] = cellOf(p).split(",").map(Number);
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const cell = grid.get(`${cx + dx},${cy + dy}`);
          if (!cell) continue;
          for (const c of cell) {
            if (c.si === si || seenOther.has(c.si)) continue;
            const q = resampled[c.si][c.pi];
            if (Math.hypot(p[0] - q[0], p[1] - q[1]) > COINCIDENCE_THRESHOLD_M) continue;
            seenOther.add(c.si);
            const tA = tangentAt(pts, pi);
            const tB = tangentAt(resampled[c.si], c.pi);
            members.push({ si: c.si, sameDir: (tA[0] * tB[0] + tA[1] * tB[1]) >= 0 });
          }
        }
      }
      membership[si][pi] = members;
    });
  });

  // Per-point raw offset -- how far sideways THIS point wants to shift,
  // based only on its own membership. Zero wherever nothing else is
  // nearby; +/- some multiple of LANE_OFFSET_PX (converted to meters at
  // this point's own latitude/the current zoom) wherever it's bundled.
  return resampled.map((pts, si) => {
    const rawOffsets = pts.map((p, pi) => {
      const members = membership[si][pi];
      const n = members.length;
      if (n < 2) return 0;
      const sortedIds = members.map(m => m.si).sort((a, b) => a - b);
      const mine = members.find(m => m.si === si);
      const rank = sortedIds.indexOf(si) - (n - 1) / 2;
      const sign = mine.sameDir ? 1 : -1;
      const lat = toLonLat(p, refLat)[1];
      return rank * sign * LANE_OFFSET_PX * metersPerPixelAt(lat, zoom);
    });
    // ~7 points * 12m step =~ 84m taper zone either side of a merge/split
    // point -- long enough to read as a deliberate diagonal, short enough
    // not to visibly shift the line miles from where the real road is.
    const smoothed = smoothValues(rawOffsets, 3);
    const offsetXY = offsetPolylineXY(pts, smoothed);
    return { ...segments[si], coords: offsetXY.map(p => toLonLat(p, refLat)) };
  });
}

function segmentsToFeatures(segments) {
  const list = Array.isArray(segments) ? segments : (segments && segments.coords ? [segments] : []);
  const valid = list.filter(s => s && s.coords && s.coords.length > 1);
  return bundleSegments(valid)
    .filter(s => s.coords && s.coords.length > 1)
    .map(s => ({
      type: "Feature",
      geometry: { type: "LineString", coordinates: s.coords },
      properties: { color: s.color || "#1c1c1a" }
    }));
}

// Raw (pre-bundling) inputs to the two functions below, kept around so
// the zoomend listener further down can re-run bundleSegments' geometric
// offsetting against the CURRENT zoom -- offsetPolylineMeters bakes a
// real-world-meters offset into the actual coordinates (unlike the old
// paint-based line-offset, which stayed pixel-correct automatically at
// any zoom for free), so it has to be redone whenever the zoom settles
// somewhere new, or lanes drawn for one zoom would drift the wrong
// apparent width once you zoom to another.
let lastActiveSegmentsInput = [];
let lastBeforeSegmentsInput = [];

function setActiveSegment(coordsOrSegments, color) {
  const src = map.getSource("active-segment");
  if (!src) return;
  const segments = Array.isArray(coordsOrSegments) && coordsOrSegments.length && !Array.isArray(coordsOrSegments[0])
    ? coordsOrSegments // already an array of {coords,color} objects
    : { coords: coordsOrSegments, color };
  lastActiveSegmentsInput = segments;
  src.setData({ type: "FeatureCollection", features: segmentsToFeatures(segments) });
}

// The already-passed leg from a route's Point A (its terminating stop) up
// to the stop that was just clicked — drawn in the route's own color but
// at reduced opacity, so it reads as "context" rather than "destination".
function setBeforeSegment(coordsOrSegments, color) {
  const src = map.getSource("before-segment");
  if (!src) return;
  const segments = Array.isArray(coordsOrSegments) && coordsOrSegments.length && !Array.isArray(coordsOrSegments[0])
    ? coordsOrSegments
    : { coords: coordsOrSegments, color };
  lastBeforeSegmentsInput = segments;
  src.setData({ type: "FeatureCollection", features: segmentsToFeatures(segments) });
}

// The name of the stop sitting at vertex 0 of a route's shape — i.e. its
// Point A / terminating stop (see build-route-shapes.js and the A/B
// split convention: Point A is always the terminating stop, so it's
// always the lowest vertex index in a correctly-built shape).
function routePointAName(routeId) {
  const shape = ROUTE_SHAPES[routeId];
  if (!shape) return null;
  let bestName = null, bestVertex = Infinity;
  shape.stopIndex.forEach((vertices, name) => {
    const v = vertices[0]; // sorted ascending — the earliest occurrence is what matters here
    if (v < bestVertex) { bestVertex = v; bestName = name; }
  });
  return bestName;
}

// Shows direction arrows only for the given route id(s) — hidden the
// rest of the time (see the route-direction-arrows layer's default
// filter above). Called from setRouteDimming and setRouteOverview so
// arrows always track exactly which route(s) are currently highlighted,
// never the full always-on set. Pass null/empty to hide them again.
function setRouteArrows(routeIdOrIds) {
  const ids = Array.isArray(routeIdOrIds) ? routeIdOrIds : (routeIdOrIds ? [routeIdOrIds] : []);
  map.setFilter("route-direction-arrows", ids.length ? ["in", ["get", "id"], ["literal", ids]] : ["==", ["get", "id"], "__none__"]);
}

// Dims every route line to greyscale/near-invisible except `highlightRouteId`
// (which is itself dimmed too — its "before" and "active" legs are drawn as
// separate overlay layers on top, so only the untouched rest of its own
// path fades with everything else). Pass null to restore normal styling.
//
// The `highlightRouteId` branch doesn't touch route-direction-arrows: for
// a specific destination pick, direction arrows are drawn by
// before-segment-arrows / active-segment-arrows instead (see their setup
// above), scoped to exactly the highlighted leg rather than the route's
// whole shape. The base arrows layer is reserved for setRouteOverview's
// "every route that serves this stop" view, where there's no specific leg
// to scope them to.
//
// The `null` (reset) branch DOES clear them, though — this is the one
// function every "close/reset" path calls (popup close, opening a new
// popup), regardless of which mode — destination pick or "Stop
// information" — was actually active beforehand. Only clearing arrows
// from inside setRouteOverview left them stuck on if a Stop Information
// popup was closed, since that reset path never went through
// setRouteOverview at all.
function setRouteDimming(highlightRouteId) {
  if (!highlightRouteId) {
    setRouteArrows(null);
    map.setPaintProperty("route-line", "line-color", BASELINE_ROUTE_COLOR);
    map.setPaintProperty("route-line", "line-opacity", BASELINE_ROUTE_OPACITY);
    return;
  }
  map.setPaintProperty("route-line", "line-color", "#b5b3ad");
  map.setPaintProperty("route-line", "line-opacity", 0.05);
}

// Like setRouteDimming, but for showing SEVERAL routes at once, each in
// its own real color at full opacity, with no separate active/before
// overlay layers — used by the "Stop information" all-routes overview,
// where there's no specific direction/segment chosen, just "every route
// that serves this stop". Everything not in `routeIds` gets the same
// greyscale treatment as setRouteDimming. Pass null/empty to restore.
function setRouteOverview(routeIds) {
  setRouteArrows(routeIds);
  if (!routeIds || !routeIds.length) {
    map.setPaintProperty("route-line", "line-color", BASELINE_ROUTE_COLOR);
    map.setPaintProperty("route-line", "line-opacity", BASELINE_ROUTE_OPACITY);
    return;
  }
  const isHighlighted = ["in", ["get", "id"], ["literal", routeIds]];
  map.setPaintProperty("route-line", "line-color", ["case", isHighlighted, ["get", "color"], "#b5b3ad"]);
  map.setPaintProperty("route-line", "line-opacity", ["case", isHighlighted, 0.9, 0.05]);
}

// Every place that filters or re-colors the "stops" source's dots needs
// to apply the exact same treatment to their labels, or a filtered-out
// dot could still leave its name floating on the map (or vice versa).
// Kept as one array so a future third stops-source layer only needs
// adding here, not at every call site below.
const STOPS_LAYER_IDS = ["stops-circle", "stops-label"];

// Hides every stop marker not served by ANY route in `routeIdOrIds`, so a
// highlighted route (or set of routes) doesn't stay cluttered with pins
// from every other route in town. Each stop feature's "routes" property
// is the array of route ids serving it (see buildStopsGeoJSON). Accepts
// a single route id or an array; pass null/empty to show every stop.
function setStopsFilter(routeIdOrIds) {
  const ids = Array.isArray(routeIdOrIds) ? routeIdOrIds : (routeIdOrIds ? [routeIdOrIds] : []);
  // Every path that re-filters the stops layer starts from a clean slate
  // as far as the "passed" grey-out goes -- setStopsFilterByNamesWithPassed
  // (below) is the only place that re-applies it afterward, so a stale
  // grey set from a previous destination pick can never leak into an
  // unrelated view.
  setStopsPassedNames(null);
  const filter = ids.length ? ["any", ...ids.map(id => ["in", id, ["get", "routes"]])] : null;
  STOPS_LAYER_IDS.forEach(id => map.setFilter(id, filter));
}

// Narrower cousin of setStopsFilter, used by showFinalDestinationsForStop:
// instead of showing every stop served by a route ANYWHERE along its
// line, this shows only stops by exact NAME, so a stop that's already
// been passed (behind the selected stop, or on a leg/direction that
// isn't the one being drawn) stays hidden instead of cluttering the map
// as a pin with no line actually serving it from here. Pass null/empty
// to show every stop again (same as setStopsFilter(null)).
function setStopsFilterByNames(names) {
  setStopsPassedNames(null);
  const filter = (names && names.length) ? ["in", ["get", "name"], ["literal", names]] : null;
  STOPS_LAYER_IDS.forEach(id => map.setFilter(id, filter));
}

// Drives the "serviced but already passed" treatment: stops behind the
// rider on the dimmed "before" leg still get shown (unlike the plain
// setStopsFilterByNames behavior above, which just hides them outright)
// but rendered grey/low-opacity, same visual language as the existing
// "inactive" (FD3 weekend-only) stops -- so a glance at the map tells you
// a dot is real-but-already-behind-you rather than making it look like
// the route never served it at all. Pass null/empty to go back to every
// visible stop reading as fully "active" (aside from genuinely inactive
// ones).
function setStopsPassedNames(names) {
  const passed = (names && names.length) ? names : [];
  const isPassed = ["in", ["get", "name"], ["literal", passed]];
  // In cartography embed mode, applyCartographyMapStyle() already set
  // stops-circle to the hollow white/navy print style, and the sidebar's
  // own "Stop labels" panel owns stops-label's text-color directly --
  // this function's normal red/grey "already passed" treatment would
  // silently fight both of those every time a stop is (re)picked, which
  // is exactly what was undoing the print styling after the fact. Keep
  // the passed/inactive DIMMING behavior (opacity), just not the colors.
  map.setPaintProperty("stops-circle", "circle-color", CARTOGRAPHY_EMBED
    ? "#ffffff"
    : ["case", ["get", "inactive"], "#9aa0a6", isPassed, "#9aa0a6", "#E73D4A"]);
  map.setPaintProperty("stops-circle", "circle-opacity", [
    "case", ["get", "inactive"], 0.45, isPassed, 0.4, 1
  ]);
  map.setPaintProperty("stops-circle", "circle-stroke-opacity", [
    "case", ["get", "inactive"], 0.6, isPassed, 0.55, 1
  ]);
  if (!CARTOGRAPHY_EMBED) {
    map.setPaintProperty("stops-label", "text-color", [
      "case", ["get", "inactive"], "#9aa0a6", isPassed, "#9aa0a6", "#c1272d"
    ]);
  }
}

// Combines the two above for the "→ destination" click flow: shows both
// the stops still ahead (full color) AND the ones already passed on the
// dimmed leg behind the rider (grey/low-opacity) in one filter, instead
// of setStopsFilterByNames's all-or-nothing hide. setStopsFilterByNames
// runs first specifically because it resets the passed-set to empty --
// setStopsPassedNames has to be applied after, or its own reset would
// immediately wipe out what we just set.
function setStopsFilterByNamesWithPassed(activeNames, passedNames) {
  const all = [...new Set([...(activeNames || []), ...(passedNames || [])])];
  setStopsFilterByNames(all);
  setStopsPassedNames(passedNames);
}

// Given one route's forward "active" segment (a slice — possibly
// reversed — of that route's own shape.coordinates, as produced by
// getForwardSegmentToDestination), works out every stop NAME that falls
// within the vertex range it spans. Relies on slice() preserving the
// original coordinate array *references* (not copies), so the exact
// same object instances can be located again in shape.coordinates via
// indexOf — cheaper and far less error-prone than re-deriving the same
// vertex math getJunctionSegments/getHubLoopVertices already worked out
// once to build activeSeg in the first place.
function getForwardStopNames(routeId, activeSeg) {
  const shape = ROUTE_SHAPES[routeId];
  if (!shape || !activeSeg || !activeSeg.length) return [];
  const a = shape.coordinates.indexOf(activeSeg[0]);
  const b = shape.coordinates.indexOf(activeSeg[activeSeg.length - 1]);
  if (a === -1 || b === -1) return [];
  const loVertex = Math.min(a, b), hiVertex = Math.max(a, b);
  const names = [];
  shape.stopIndex.forEach((vertices, name) => {
    if (vertices.some(v => v >= loVertex && v <= hiVertex)) names.push(name);
  });
  return names;
}

// Called from the "Stop information" button. Shows EVERY route that
// serves this stop at once — each in its own color, base route-line
// layer only (no active/before slicing, since there's no single chosen
// direction) — dims every other route, and hides every stop marker not
// on one of these routes. This is the "overview" counterpart to
// highlightRouteToDestination's single-direction drill-down; both can be
// used interchangeably from the same popup.
window.highlightAllRoutesForStop = function (stopName) {
  const stopEntry = STOPS.find(s => s.name === stopName);
  if (!stopEntry) return;
  const routeIds = [...new Set(stopEntry.services.map(sv => sv.route))].filter(id => ROUTE_META[id]);
  if (!routeIds.length) return;

  setActiveSegment(null);
  setBeforeSegment(null);
  setRouteOverview(routeIds);
  setStopsFilter(routeIds);
  clearDestLabels();

  const allCoords = routeIds.flatMap(id => (ROUTE_LINES[id] || []).flat());
  if (allCoords.length) {
    const lons = allCoords.map(c => c[0]), lats = allCoords.map(c => c[1]);
    map.fitBounds(
      [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
      { padding: 70, maxZoom: 15, duration: FIT_DURATION }
    );
  }
};

// Resolves just the forward "active" stretch from fromStopName onward to
// one destination out of getStopDestinations's list — no "before" leg,
// since showFinalDestinationsForStop (the only caller) only ever draws
// the onward direction. Mirrors the same resolution order
// highlightRouteToDestination/highlightRouteToHubLoop use for a single
// destination, just stripped down to the coordinates it actually needs:
// hub-loop destinations go through getHubLoopVertices (a real second
// out-and-back leg getJunctionSegments can't express), everything else
// tries getJunctionSegments first (handles dual-pole junctions like PTC A
// correctly) and falls back to a plain direct segment.
function getForwardSegmentToDestination(routeId, fromStopName, dest) {
  if (dest.isFixedLoop) {
    // Loop tunggal (ROUTE_LOOP_LABEL) -- gak ada leg buat dihitung, "maju
    // ke arah destinasi" ya seluruh garis loop-nya, apapun posisi
    // fromStopName sekarang.
    const shape = ROUTE_SHAPES[routeId];
    return shape ? shape.coordinates : null;
  }
  if (dest.isHubLoop) {
    const hv = getHubLoopVertices(routeId);
    return hv ? hv.shape.coordinates.slice(hv.hubVertex, hv.endVertex + 1) : null;
  }
  const junction = getJunctionSegments(routeId, fromStopName, dest.name);
  if (junction) return junction.activeSeg;
  return getDirectRouteSegment(routeId, fromStopName, dest.name)
    || getRouteSegment(routeId, fromStopName, dest.name);
}

// Called from the "Show final destination" button in the docked "Stop
// information" panel. Unlike highlightAllRoutesForStop (which just shows
// every serving route's FULL shape, undimmed), this draws each route's
// own onward leg — from this stop forward to that route's turnaround
// point (if this stop is before it) or its actual last stop (if this
// stop is already past the turnaround) — as a solid glowing overlay in
// that route's color. No dimmed "already travelled" leg is drawn; only
// the forward stretch. Every other route still fades to grey, same as
// the plain overview. Multiple routes at once is exactly why
// setActiveSegment above learned to accept arrays.
//
// A single route can have more than one onward destination from this
// same physical stop (see getStopDestinations — dual-pole junctions like
// PTC A on FD6, hub-loop stops like T.O.W or Terminal Benowo) -- so each
// route can contribute more than one segment here, all drawn at once in
// that route's color, rather than picking just one.
// Small always-on "-> destination" pills (route badge(s) + place name)
// dropped at the origin stop and each final-destination endpoint --
// used by showFinalDestinationsForStop, highlightRouteToDestination, and
// highlightRouteToHubLoop. Same MapLibre Marker approach as the trip
// planner's board/transfer/alight pins (see planMarkers below), just its
// own array since only one of these features is ever active at once but
// each should tear down cleanly on its own.
let destLabelMarkers = [];
window.getDestLabelMarkers = () => destLabelMarkers; // exposed for cartography.html's label list/reset
// True only while a "-> destination" pick from a stop popup
// (highlightRouteToDestination / highlightRouteToHubLoop) is showing its
// highlighted segment + endpoint badge. Those two now close the floating
// stop popup as soon as they run (see their own comments) so it doesn't
// cover the line -- but that means the popup's "close" handler, which
// used to be the only thing tearing this state back down, no longer has
// anything to close. The blank-map click handler below uses this flag to
// know there's something of ITS OWN to clear, without also stomping on
// unrelated persistent state like the open route-detail view.
let quickDestinationPickActive = false;
function clearDestLabels() {
  destLabelMarkers.forEach(m => m.remove());
  destLabelMarkers = [];
  quickDestinationPickActive = false;
}

// ---- Cartography editor hooks ------------------------------------------
// Only ever called from cartography.html (same-origin iframe embed);
// normal app usage never touches these. Lets the destination pill's TEXT
// be nudged a few pixels off its anchor -- e.g. so "Sumbawa" can be moved
// clear of a route line for print -- without moving the actual dot/anchor
// coordinate the pill is attached to (that stays a real MapLibre Marker
// pinned to the stop's lon/lat; only the label pill inside it gets an
// extra CSS offset on top of its normal translate).
window.setDestLabelDragEnabled = function (enabled) {
  document.body.classList.toggle("cartography-drag", !!enabled);
};
// `dragClass` lets the same pointer-drag mechanics serve two independent
// "enable dragging" toggles (destination pills vs. stop-name labels,
// below) without one accidentally dragging the other's elements.
function wireDestLabelDrag(el, dragClass = "cartography-drag") {
  let dragging = null;
  el.addEventListener("pointerdown", (e) => {
    if (!document.body.classList.contains(dragClass)) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const x0 = parseFloat(el.dataset.dragX || 0), y0 = parseFloat(el.dataset.dragY || 0);
    dragging = { startX: e.clientX, startY: e.clientY, x0, y0 };
  });
  el.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragging.startX, dy = e.clientY - dragging.startY;
    el.dataset.dragX = dragging.x0 + dx;
    el.dataset.dragY = dragging.y0 + dy;
    el.style.setProperty("--drag-x", `${el.dataset.dragX}px`);
    el.style.setProperty("--drag-y", `${el.dataset.dragY}px`);
  });
  el.addEventListener("pointerup", () => { dragging = null; });
  el.addEventListener("pointercancel", () => { dragging = null; });
}
// Resets a single dragged element (destination pill OR stop-name label)
// back to its default position -- cartography.html calls this from each
// row's "Reset" button, or in bulk for "Reset all".
function resetDragOffset(el) {
  delete el.dataset.dragX; delete el.dataset.dragY;
  el.style.removeProperty("--drag-x"); el.style.removeProperty("--drag-y");
}
window.resetDestLabelDrag = resetDragOffset;

// Applied to the "stops-label" MapLibre layer (the stop-name text baked
// onto the map canvas itself, distinct from the HTML destination pills
// above) -- cartography.html's "Stops" panel calls this on every change.
window.setStopLabelStyle = function (opts = {}) {
  if (!map.getLayer("stops-label")) return;
  const {
    visible = true, size = 11, color = "#c1272d", haloColor = "#ffffff",
    haloWidth = 1.4, anchor = "left", weight = "medium",
    uppercase = false, alwaysShow = true
  } = opts;
  safeSetLayout("stops-label", "visibility", visible ? "visible" : "none");
  safeSetLayout("stops-label", "text-size", size);
  safeSetLayout("stops-label", "text-anchor", anchor);
  safeSetLayout("stops-label", "text-offset",
    anchor === "right" ? [-0.7, 0] : anchor === "center" ? [0, 1.1] : [0.7, 0]);
  const fontName = weight === "bold" ? "Noto Sans Bold"
    : weight === "italic" ? "Noto Sans Italic"
    : weight === "regular" ? "Noto Sans Regular"
    : "Noto Sans Medium";
  safeSetLayout("stops-label", "text-font", [fontName]);
  safeSetLayout("stops-label", "text-transform", uppercase ? "uppercase" : "none");
  safeSetPaint("stops-label", "text-color", color);
  safeSetPaint("stops-label", "text-halo-color", haloColor);
  safeSetPaint("stops-label", "text-halo-width", haloWidth);
  safeSetPaint("stops-label", "text-opacity", alwaysShow ? 1 :
    ["interpolate", ["linear"], ["zoom"], 14, 0, 15, 1]);
  safeSetLayout("stops-label", "text-optional", !alwaysShow);
  // minzoom is a LAYER-level field, not a layout property -- it has to go
  // through setLayerZoomRange, never setLayoutProperty (which was the
  // actual bug here: MapLibre throws on an unrecognized layout property
  // name rather than silently ignoring it, which was aborting every call
  // after this one too before the safeSet* wrappers above existed).
  try { map.setLayerZoomRange("stops-label", alwaysShow ? 0 : 14, 24); }
  catch (err) { console.warn('[cartography] setLayerZoomRange("stops-label") failed:', err); }
  // "Always visible" means truly always -- including when two nearby
  // stops' names would otherwise collide, which MapLibre's default
  // collision detection silently drops one of rather than overlapping.
  // For a wayfinding printout every name showing matters more than tidy
  // spacing, so force both past that when the toggle is on.
  safeSetLayout("stops-label", "text-allow-overlap", alwaysShow);
  safeSetLayout("stops-label", "text-ignore-placement", alwaysShow);
};

// ---- Draggable stop-name labels (cartography.html only) -----------------
// The "stops-label" MapLibre layer above renders every name as part of
// the map's own canvas -- fast, but a single layer can't let one
// particular stop's name be nudged independently of the rest. When the
// person turns on "Enable dragging" for stop labels, we swap that layer
// out for one plain HTML marker per currently-visible stop instead (same
// 0x0-wrapper anchor trick as addDestLabel above), each individually
// draggable via wireDestLabelDrag's "cartography-drag-stops" class, and
// swap back to the cheap layer the moment dragging is turned off again.
let stopLabelMarkers = []; // [{ marker, name, textEl }]
window.getStopLabelMarkers = () => stopLabelMarkers;
function clearStopLabelMarkers() {
  stopLabelMarkers.forEach(o => o.marker.remove());
  stopLabelMarkers = [];
}
function addStopLabelMarker(stopEntry) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="stop-label-marker">
      <span class="stop-label-marker-text">${getStopDisplay(stopEntry.name).base}</span>
    </div>
  `.trim();
  const textEl = wrap.querySelector(".stop-label-marker-text");
  wireDestLabelDrag(textEl, "cartography-drag-stops");
  const marker = new maplibregl.Marker({ element: wrap.firstElementChild, anchor: "center" })
    .setLngLat([stopEntry.lon, stopEntry.lat])
    .addTo(map);
  stopLabelMarkers.push({ marker, name: stopEntry.name, textEl });
}
// enabled=true: hides the cheap symbol layer and builds one draggable
// marker per name in window.lastVisibleStopNames (kept current by
// showFinalDestinationsForStop). enabled=false: tears the markers back
// down and restores the symbol layer to whatever setStopLabelStyle last
// set it to.
window.setDraggableStopLabelsEnabled = function (enabled) {
  clearStopLabelMarkers();
  if (enabled) {
    if (map.getLayer("stops-label")) map.setLayoutProperty("stops-label", "visibility", "none");
    (window.lastVisibleStopNames || []).forEach(name => {
      const s = STOPS.find(x => x.name === name);
      if (s) addStopLabelMarker(s);
    });
  } else if (map.getLayer("stops-label")) {
    map.setLayoutProperty("stops-label", "visibility",
      window._lastStopLabelVisible === false ? "none" : "visible");
  }
};
window.setStopLabelDragEnabled = function (enabled) {
  document.body.classList.toggle("cartography-drag-stops", !!enabled);
};
window.resetStopLabelDrag = resetDragOffset;
// Text styling for the HTML marker mode -- kept as its own hook (rather
// than folded into setStopLabelStyle) since it targets plain CSS, not
// MapLibre layout/paint properties, and needs to keep working on markers
// that get rebuilt on every stop change.
window.setStopLabelMarkerStyle = function (opts = {}) {
  window._lastStopLabelVisible = opts.visible !== false;
  document.documentElement.dataset.stopAnchor = opts.anchor || "left";
  let styleEl = document.getElementById("cartography-stop-label-marker-style");
  if (!styleEl) {
    styleEl = document.createElement("style");
    styleEl.id = "cartography-stop-label-marker-style";
    document.head.appendChild(styleEl);
  }
  const {
    visible = true, size = 11, color = "#c1272d", haloColor = "#ffffff",
    weight = "medium", uppercase = false
  } = opts;
  const fontWeight = weight === "bold" ? 700 : weight === "regular" ? 400 : 500;
  const fontStyle = weight === "italic" ? "italic" : "normal";
  styleEl.textContent = `
    .stop-label-marker-text {
      display: ${visible ? "inline-block" : "none"};
      font-size: ${size}px;
      color: ${color};
      font-weight: ${fontWeight};
      font-style: ${fontStyle};
      text-transform: ${uppercase ? "uppercase" : "none"};
      text-shadow:
        -1px -1px 0 ${haloColor}, 1px -1px 0 ${haloColor},
        -1px 1px 0 ${haloColor}, 1px 1px 0 ${haloColor},
        0 0 3px ${haloColor};
    }
  `;
};

// Styling hook for the destination pills' text (font/color/etc, distinct
// from the drag-position hook above) -- applied via a small injected
// stylesheet since these are plain HTML, not a MapLibre layer.
window.setDestLabelStyle = function (opts = {}) {
  let styleEl = document.getElementById("cartography-dest-label-style");
  if (!styleEl) {
    styleEl = document.createElement("style");
    styleEl.id = "cartography-dest-label-style";
    document.head.appendChild(styleEl);
  }
  const { size = 13, color = "#2350b8", weight = 700, uppercase = false } = opts;
  styleEl.textContent = `
    .dest-label-text {
      font-size: ${size}px;
      color: ${color};
      font-weight: ${weight};
      text-transform: ${uppercase ? "uppercase" : "none"};
    }
  `;
};

function addDestLabel(coord, routeIds, label) {
  if (!coord) return;
  const badges = routeIds.map(id => routeBadgeHtml(id)).join("");
  const color = (ROUTE_META[routeIds[0]] && ROUTE_META[routeIds[0]].color) || "#888";
  const wrap = document.createElement("div");
  // Same "0x0 wrapper, everything else absolutely positioned off it"
  // structure as planMarkerHtml -- see the .dest-label-marker CSS comment
  // for why that's what stops these from drifting off their real point as
  // you zoom, and .plan-marker-dot for why the dot has to be a sibling of
  // the label rather than nested inside it.
  wrap.innerHTML = `
    <div class="dest-label-marker">
