function showBusInfoPopup(busId, coord) {
  const { label } = BUS_INSTANCES[busId];
  const loc = busLatestLoc[busId];

  const updatedText = loc ? `${Math.round((Date.now() - loc.updatedAt) / 1000)}s lalu` : "-";
  const hasActiveRit = loc && loc.direction != null;
  const directionText = hasActiveRit
    ? `Menuju <strong>${DIRECTION_LABELS_MAP[loc.direction] || loc.direction}</strong>`
    : "Rit belum dimulai";
  const passengerText = hasActiveRit && loc.passengerCount != null ? `${loc.passengerCount} orang` : "-";
  const nearest = hasActiveRit ? nearestStopNameForBus(loc.direction, loc.lat, loc.lng) : null;
  const positionText = nearest ? nearest.name : "-";

  if (busPopup) busPopup.remove();
  // className "glass-popup" + struktur .glass-tag/.tag-eyebrow/.popup-title
  // di bawah SAMA PERSIS dengan popup halte (lihat sekitar baris 4780) --
  // sengaja disamakan, bukan cuma mirip, biar popup bus & popup halte
  // kerasa 1 sistem, bukan 2 desain beda yang kebetulan nempel di peta
  // yang sama.
  busPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, className: "glass-popup", offset: 18 })
    .setLngLat(coord)
    .setHTML(`
      <div class="glass-tag">
        <div class="tag-eyebrow">Bus</div>
        <div class="popup-title bus-popup-title">
          <span class="route-badge" style="color:#FB8500; background:#FB850022; border-color:#FB850055;">SiBulan 2</span>
          <span>${label}</span>
        </div>
        <div class="popup-bus-direction">${directionText}</div>
        <div class="popup-routes">
          <div class="bus-info-row"><span>Posisi</span><span>${positionText}</span></div>
          <div class="bus-info-row"><span>Penumpang</span><span>${passengerText}</span></div>
          <div class="bus-info-row"><span>Updated</span><span>${updatedText}</span></div>
        </div>
      </div>
    `)
    .addTo(map);
}

function ensureBusMarker(busId, coord) {
  if (busMarkers[busId]) {
    busMarkers[busId].setLngLat(coord);
    return busMarkers[busId];
  }
  const wrap = document.createElement("div");
  wrap.innerHTML = busMarkerHtml(busId).trim();
  const el = wrap.firstElementChild;

  el.addEventListener("click", (e) => {
    e.stopPropagation(); // jangan sampai tap ikon ke-anggep tap peta kosong
    showBusInfoPopup(busId, busMarkers[busId].getLngLat());
  });

  const marker = new maplibregl.Marker({ element: el, anchor: "center", rotationAlignment: "map" })
    .setLngLat(coord)
    .addTo(map);
  busMarkers[busId] = marker;
  updateBusMarkerZoomLevel(marker); // set kelas zoom awal begitu marker dibuat
  return marker;
}

// Toggle kelas "zoomed-in" (segitiga <-> bus) sesuai level zoom peta saat
// ini. Dipanggil sekali per marker baru, dan tiap kali peta di-zoom.
function updateBusMarkerZoomLevel(marker) {
  const el = marker.getElement();
  el.classList.toggle("zoomed-in", map.getZoom() >= BUS_ICON_ZOOM_THRESHOLD);
}

map.on("zoom", () => {
  Object.values(busMarkers).forEach(updateBusMarkerZoomLevel);
});

// ---------------------------------------------------------------------------
// Filter bus marker mana yang ditampilin, NGIKUT state route-detail yang
// SUDAH ADA di app ini (routeIdFromHash() + routeDetailLeg) -- bukan bikin
// sumber kebenaran baru yang terpisah:
//   - Nggak ada rute dibuka (plain view)        -> semua bus ditampilin.
//   - Rute dibuka, tab "Full route"              -> cuma bus yang route_id-nya
//                                                    cocok sama rute itu.
//   - Rute dibuka, tab arah ("up"/"down")         -> ditambah filter arah:
//     "up" = leg start->wayback (ke arah wayback point, "to_pakem" untuk
//     SiBulan 2), "down" = leg wayback->end ("to_adisutjipto").
// ---------------------------------------------------------------------------
function busShouldBeVisible(loc) {
  const routeId = routeIdFromHash();
  if (!routeId) return true; // plain view -- tampilkan semua bus

  if (!loc.routeId || loc.routeId !== routeId) return false; // bus ini bukan di rute yang lagi dibuka

  if (routeDetailLeg === "all") return true;
  const wantDirection = routeDetailLeg === "up" ? "to_pakem" : "to_adisutjipto";
  return loc.direction === wantDirection;
}

function updateBusMarkerVisibility() {
  for (const [busId, marker] of Object.entries(busMarkers)) {
    const loc = busLatestLoc[busId];
    const visible = loc ? busShouldBeVisible(loc) : false;
    marker.getElement().style.display = visible ? "" : "none";
  }
}

// Kalau panel detail rute lagi kebuka buat rute yang sama kayak bus-bus
// ini, refresh daftar haltenya supaya badge bus (lihat renderRouteDetailList)
// ikut update posisinya tiap tick -- bukan cuma pas panel pertama dibuka.
// renderRouteDetailList sendiri sudah save/restore scrollTop, jadi aman
// dipanggil berulang tanpa bikin daftar "lompat" ke atas.
function refreshRouteDetailBusBadgesIfOpen() {
  const routeId = routeIdFromHash();
  if (routeId && routeDetailPanel.style.display !== "none") {
    renderRouteDetailList(routeId);
  }
}

async function pollBusLocations() {
  try {
    const res = await fetch(BUS_API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    for (const busId of Object.keys(BUS_INSTANCES)) {
      const loc = data[busId];
      if (!loc) continue; // belum pernah kirim lokasi sama sekali
      // Halte terdekat (sesuai arah) di-cache di sini setiap tick -- dipakai
      // buat badge bus di daftar halte (renderRouteDetailList) TANPA perlu
      // hitung ulang tiap render, dan tanpa nunggu popup di-tap dulu.
      const nearest = loc.direction ? nearestStopNameForBus(loc.direction, loc.lat, loc.lng) : null;
      loc.nearestStopName = nearest ? nearest.name : null;
      busLatestLoc[busId] = loc;

      const marker = ensureBusMarker(busId, [loc.lng, loc.lat]);
      const isStale = Date.now() - loc.updatedAt > BUS_STALE_AFTER_MS;
      marker.getElement().classList.toggle("is-stale", isStale);
      // Abu-abu kalau kru belum/sudah tidak "Aktivasi GPS" (bus belum
      // jalan / sudah selesai jalan) -- warna rute kalau lagi aktif.
      // Warna diubah langsung di attribute fill SVG-nya, BUKAN bikin
      // ulang elemen marker, supaya posisi marker yang sudah "pakem"
      // tidak ikut ke-reset.
      const el = marker.getElement();
      const color = loc.isActive ? BUS_INSTANCES[busId].color : "#999999";
      const farShape = el.querySelector(".bus-marker-icon-far polygon");
      const nearShape = el.querySelector(".bus-marker-icon-near circle");
      if (farShape) farShape.setAttribute("fill", color);
      if (nearShape) nearShape.setAttribute("fill", color);
      // Putar ikon sesuai arah jalan bus, kalau datanya ada. Pakai
      // marker.setRotation() (API resmi MapLibre), BUKAN set style.transform
      // manual -- transform di elemen marker juga dipakai MapLibre buat
      // naruh posisinya, kalau ditimpa manual posisinya bisa geser.
      if (loc.heading != null) {
        marker.setRotation(loc.heading);
      }
    }

    updateBusMarkerVisibility();
    refreshRouteDetailBusBadgesIfOpen();

    // Tombol "cari bus" cuma ada gunanya kalau minimal 1 bus punya posisi
    // DAN lagi ditampilin (nggak ke-filter sama rute/arah yang aktif).
    if (Object.values(busMarkers).some((m) => m.getElement().style.display !== "none")) {
      document.getElementById("locateBusBtn").style.display = "flex";
    } else {
      document.getElementById("locateBusBtn").style.display = "none";
    }
  } catch (err) {
    // Sengaja cuma di-log, bukan ditampilkan ke user -- kegagalan poll
    // sesekali (misal bot lagi redeploy) nggak perlu mengganggu peta.
    console.error("Gagal memuat lokasi bus:", err);
  }
}

function locateBuses() {
  const coords = Object.values(busMarkers).map((m) => m.getLngLat());
  if (coords.length === 0) return;

  if (coords.length === 1) {
    map.flyTo({ center: coords[0], zoom: Math.max(map.getZoom(), 15) });
    return;
  }
  const lons = coords.map((c) => c.lng);
  const lats = coords.map((c) => c.lat);
  map.fitBounds(
    [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    { padding: 80, maxZoom: 16 }
  );
}

pollBusLocations();
setInterval(pollBusLocations, BUS_POLL_INTERVAL_MS);

// ---------------------------------------------------------------------------
// Live bus markers -- Armada Smart Campus UGM (5 bus kampus, Bus A-E).
// Sumber data: WebSocket UGM hasil reverse engineering, TAPI browser di
// sini TIDAK connect langsung ke wss://armada.smartcampus.ugm.ac.id --
// lewat proxy /api/armada-ugm (lihat api/armada-ugm.js) yang jadi WS
// client-nya, supaya:
//   1. Tidak tergantung origin/CORS/WebSocket policy server UGM ngizinin
//      domain kita atau tidak (lihat README section 15).
//   2. Frontend cukup fetch() JSON biasa, pola pollingnya sama persis
//      seperti pollBusLocations() SiBulan di atas -- gampang dirawat
//      bareng.
//
// Reuse dari blok SiBulan di atas: TRIANGLE_ICON_SVG, BUS_ICON_SVG (ikon
// sama), updateBusMarkerZoomLevel (baca map.getZoom(), generik, tidak
// spesifik SiBulan).
//
// BELUM ada: mapping bus ini jalan di rute Transgama yang mana (arah/leg),
// jadi TIDAK ada filter arah kayak busShouldBeVisible() SiBulan -- kelima
// bus ditampilkan bareng selama "Armada UGM" kepilih / tidak ada rute
// dibuka. Device ID -> nama bus (Bus A-E) juga hasil reverse engineering,
// belum dikonfirmasi resmi -- lihat README_Reverse_Engineering_GPS_Armada_UGM.md.
// ---------------------------------------------------------------------------

const ARMADA_UGM_API_URL = "/api/armada-ugm";
const ARMADA_UGM_POLL_INTERVAL_MS = 5000;
// Sama seperti BUS_STALE_AFTER_MS SiBulan -- marker dipudarkan (is-stale),
// bukan dihilangkan, kalau lama tidak ada update baru.
const ARMADA_UGM_STALE_AFTER_MS = 2 * 60 * 1000;

const ARMADA_UGM_COLOR = ROUTE_META["Armada UGM"].color;
// Key = deviceid dari WebSocket UGM (lihat api/armada-ugm.js untuk mapping
// ke nama). Label di sini dipakai buat popup saja.
const ARMADA_UGM_INSTANCES = {
  "4":  { label: "Bus A" },
  "11": { label: "Bus B" },
  "8":  { label: "Bus C" },
  "10": { label: "Bus D" },
  "9":  { label: "Bus E" },
};

let armadaUgmMarkers = {}; // { "4": maplibregl.Marker, ... } key = deviceid
let armadaUgmLatestLoc = {};
let armadaUgmPopup = null; // 1 popup kebuka dalam satu waktu, terpisah dari busPopup SiBulan
// deviceId yang popup-nya lagi kebuka -- null kalau tidak ada. Dipakai
// pollArmadaUgmLocations() buat tau popup mana yang perlu ikut digeser
// tiap tick, supaya popup tidak "ketinggalan" saat marker-nya sudah
// pindah ke posisi baru (bug: dulu popup cuma di-setLngLat SEKALI pas
// dibuka, tidak pernah di-update lagi walau bus-nya terus jalan).
let armadaUgmPopupDeviceId = null;

function armadaUgmMarkerHtml(deviceId) {
  return `
    <div class="bus-marker" data-armada-ugm-id="${deviceId}">
      <div class="bus-marker-icon-far">${TRIANGLE_ICON_SVG(ARMADA_UGM_COLOR)}</div>
      <div class="bus-marker-icon-near">${BUS_ICON_SVG(ARMADA_UGM_COLOR)}</div>
    </div>
  `;
}

// Hapus SEMUA elemen popup Armada UGM dari DOM secara paksa, bukan cuma
// andalkan variabel armadaUgmPopup. Ditemukan lewat testing: klik icon bus
// berkali-kali bisa bikin beberapa popup numpuk di posisi berbeda-beda
// (armadaUgmPopup.remove() doang ternyata tidak selalu cukup reliable buat
// nyingkirin instance sebelumnya) -- kelihatan kayak "icon floating/drift"
// padahal itu kartu popup yang ketinggalan, bukan icon bus-nya sendiri.
function removeAllArmadaUgmPopups() {
  document.querySelectorAll(".armada-ugm-popup").forEach((el) => el.remove());
}

function armadaUgmPopupHtml(deviceId) {
  const { label } = ARMADA_UGM_INSTANCES[deviceId];
  const loc = armadaUgmLatestLoc[deviceId];
  // Math.max(0, ...) -- tanpa ini kadang muncul "-1s lalu" kalau jam
  // server (tempat updatedAt di-set, lihat api/armada-ugm.js) sedikit
  // lebih cepat dari jam device -- bukan bug data, cuma clock skew biasa,
  // tapi kelihatan aneh kalau dibiarkan minus.
  const updatedText = loc ? `${Math.max(0, Math.round((Date.now() - loc.updatedAt) / 1000))}s lalu` : "-";
  return `
    <div class="glass-tag">
      <div class="tag-eyebrow">Bus</div>
      <div class="popup-title bus-popup-title">
        <span class="route-badge" style="color:${ARMADA_UGM_COLOR}; background:${ARMADA_UGM_COLOR}22; border-color:${ARMADA_UGM_COLOR}55;">Armada UGM</span>
        <span>${label}</span>
      </div>
      <div class="popup-routes">
        <div class="bus-info-row"><span>Updated</span><span>${updatedText}</span></div>
      </div>
    </div>
  `;
}

function showArmadaUgmPopup(deviceId, coord) {
  removeAllArmadaUgmPopups(); // paksa bersih -- lihat catatan di removeAllArmadaUgmPopups()
  // Struktur .glass-tag/.tag-eyebrow/.popup-title sama seperti popup bus
  // SiBulan & popup halte -- lihat komentar di showBusInfoPopup soal
  // kenapa disamakan persis.
  armadaUgmPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: true, className: "glass-popup armada-ugm-popup", offset: 18 })
    .setLngLat(coord)
    .setHTML(armadaUgmPopupHtml(deviceId))
    .addTo(map);
  armadaUgmPopupDeviceId = deviceId;
  // Reset penanda begitu popup ditutup (klik X, atau klik peta kosong
  // karena closeOnClick) -- supaya pollArmadaUgmLocations() berhenti
  // nyoba geser popup yang sudah tidak ada.
  armadaUgmPopup.on("close", () => {
    if (armadaUgmPopupDeviceId === deviceId) armadaUgmPopupDeviceId = null;
  });
}

function ensureArmadaUgmMarker(deviceId, coord) {
  if (armadaUgmMarkers[deviceId]) {
    armadaUgmMarkers[deviceId].setLngLat(coord);
    return armadaUgmMarkers[deviceId];
  }
  const wrap = document.createElement("div");
  wrap.innerHTML = armadaUgmMarkerHtml(deviceId).trim();
  const el = wrap.firstElementChild;

  el.addEventListener("click", (e) => {
    e.stopPropagation();
    showArmadaUgmPopup(deviceId, armadaUgmMarkers[deviceId].getLngLat());
  });

  const marker = new maplibregl.Marker({ element: el, anchor: "center", rotationAlignment: "map" })
    .setLngLat(coord)
    .addTo(map);
  armadaUgmMarkers[deviceId] = marker;
  updateBusMarkerZoomLevel(marker); // fungsi generik dari blok SiBulan, cuma baca map.getZoom()
  return marker;
}

map.on("zoom", () => {
  Object.values(armadaUgmMarkers).forEach(updateBusMarkerZoomLevel);
});

// Tidak ada konsep arah/leg buat armada ini (lihat catatan di atas), jadi
// visibility-nya cuma soal "rute mana yang lagi dibuka", bukan diturunkan
// dari arah seperti busShouldBeVisible() SiBulan.
function armadaUgmShouldBeVisible() {
  const routeId = routeIdFromHash();
  if (!routeId) return true; // plain view -- tampilkan semua
  return routeId === "Armada UGM";
}

function updateArmadaUgmMarkerVisibility() {
  const visible = armadaUgmShouldBeVisible();
  for (const marker of Object.values(armadaUgmMarkers)) {
    marker.getElement().style.display = visible ? "" : "none";
  }
}

async function pollArmadaUgmLocations() {
  try {
    const res = await fetch(ARMADA_UGM_API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    for (const deviceId of Object.keys(ARMADA_UGM_INSTANCES)) {
      const loc = data[deviceId];
      if (!loc) continue; // device ini belum pernah kirim posisi di payload terakhir
      armadaUgmLatestLoc[deviceId] = loc;

      const marker = ensureArmadaUgmMarker(deviceId, [loc.lng, loc.lat]);
      const isStale = Date.now() - loc.updatedAt > ARMADA_UGM_STALE_AFTER_MS;
      marker.getElement().classList.toggle("is-stale", isStale);

      // Kalau popup bus ini lagi kebuka, ikutkan posisinya + refresh teks
      // "Updated Xs lalu" -- ini yang benerin bug "popup floating"
      // (popup ketinggalan di posisi lama saat bus-nya sudah jalan).
      if (armadaUgmPopup && armadaUgmPopupDeviceId === deviceId) {
        armadaUgmPopup.setLngLat([loc.lng, loc.lat]).setHTML(armadaUgmPopupHtml(deviceId));
      }
    }

    updateArmadaUgmMarkerVisibility();
  } catch (err) {
    // Sengaja cuma di-log -- kegagalan poll sesekali (proxy lagi cold
    // start, atau WS UGM lagi nggak respon) nggak perlu ganggu user.
    console.error("Gagal memuat lokasi armada UGM:", err);
  }
}

pollArmadaUgmLocations();
setInterval(pollArmadaUgmLocations, ARMADA_UGM_POLL_INTERVAL_MS);

// Wraps a marker's full-detail card together with a small always-available
// "compact pin" version. Both are rendered every time; CSS (driven by the
// body.zoomed-out class) decides which one is visible, so switching zoom
// levels never needs to touch the DOM again.
// The dot is a separate absolutely-positioned sibling (not nested inside
// the compact pill) specifically so its position is pinned to the anchor
// point regardless of how wide the pill's label text ends up being --
// see the .plan-marker CSS comment for why that matters.
function planMarkerHtml(color, fullInner, compactInner) {
  return `
    <div class="plan-marker">
      <div class="plan-marker-full">${fullInner}</div>
      <span class="plan-marker-dot" style="--pin-color:${color}"></span>
      <div class="plan-marker-compact">${compactInner}</div>
    </div>
  `;
}

function renderPlanMarkers(legs) {
  clearPlanMarkers();
  if (!legs || !legs.length) return;

  const first = legs[0];
  addPlanMarker(first.coords[0], planMarkerHtml(
    "#1e8f4e",
    `<div class="plan-marker-title">${stopTitleHtml(first.from)}</div>
     <div class="plan-marker-eyebrow board">Board</div>
     <div class="plan-marker-line">${routeBadgeHtml(first.routeId)} towards ${getStopDisplay(first.to).base}</div>`,
    routeBadgeHtml(first.routeId)
  ));

  for (let i = 0; i < legs.length - 1; i++) {
    const leg = legs[i], nextLeg = legs[i + 1];
    addPlanMarker(leg.coords[leg.coords.length - 1], planMarkerHtml(
      "#b5860b",
      `<div class="plan-marker-title">${stopTitleHtml(leg.to)}</div>
       <div class="plan-marker-eyebrow transfer">Transfer</div>
       <div class="plan-marker-line">${routeBadgeHtml(leg.routeId)}<span class="plan-marker-arrow">&rarr;</span>${routeBadgeHtml(nextLeg.routeId)} towards ${getStopDisplay(nextLeg.to).base}</div>`,
      `${routeBadgeHtml(leg.routeId)}<span class="plan-marker-arrow">&rarr;</span>${routeBadgeHtml(nextLeg.routeId)}`
    ));
  }

  const last = legs[legs.length - 1];
  addPlanMarker(last.coords[last.coords.length - 1], planMarkerHtml(
    "#b5342c",
    `<div class="plan-marker-title">${stopTitleHtml(last.to)}</div>
     <div class="plan-marker-eyebrow alight">Alighting from</div>
     <div class="plan-marker-line">${routeBadgeHtml(last.routeId)}</div>`,
    routeBadgeHtml(last.routeId)
  ));
}

// Full teardown of every planner-driven map state: the bold overlay line,
// the board/transfer/alight tags, the "dim everything else" treatment,
// and the stop-marker filter. Called both before drawing a fresh result
// (so a second search doesn't leave the first one's leftovers behind) and
// whenever the planner/popup flow needs a clean slate.
function resetPlannerHighlight() {
  setPlannedRoute(null);
  clearPlanMarkers();
  clearDestLabels();
  setRouteDimming(null);
  setStopsFilter(null);
}

function renderItinerary(legs, totalDistance) {
  const km = (totalDistance / 1000).toFixed(1);
  const stepsHtml = legs.map(leg => {
    const meta = ROUTE_META[leg.routeId] || {};
    return `<div class="planner-step">
      <span class="route-badge" style="color:${meta.color || "#888"};background:${meta.color || "#888"}22;border-color:${meta.color || "#888"}55;">${leg.routeId}</span>
      <span>${getStopDisplay(leg.from).base} &rarr; ${getStopDisplay(leg.to).base}</span>
    </div>`;
  }).join(`<div class="planner-transfer">transfer</div>`);
  const busWord = legs.length === 1 ? "bus" : "buses";
  return `<div class="planner-summary">${legs.length} ${busWord} &middot; ~${km} km</div>${stepsHtml}`;
}

// ---- Trip planner UI -----------------------------------------------------
let planFrom = null, planTo = null;
window.pickMode = null;

function setPlanStop(target, name) {
  if (target === "from") { planFrom = name; document.getElementById("plan-from").value = getStopDisplay(name).base; }
  else { planTo = name; document.getElementById("plan-to").value = getStopDisplay(name).base; }
}

const plannerToggle = document.getElementById("planner-toggle");
const plannerPanel = document.getElementById("planner-panel");
plannerToggle.addEventListener("click", () => {
  const isOpen = plannerPanel.style.display !== "none";
  plannerPanel.style.display = isOpen ? "none" : "block";
  plannerToggle.textContent = isOpen ? "Plan a trip" : "Close trip planner";
  if (isOpen) {
    resetPlannerHighlight();
    window.pickMode = null;
    document.querySelectorAll(".pick-btn").forEach(b => b.classList.remove("active"));
  }
});

document.getElementById("planner-swap").addEventListener("click", () => {
  [planFrom, planTo] = [planTo, planFrom];
  const fromInput = document.getElementById("plan-from"), toInput = document.getElementById("plan-to");
  const tmp = fromInput.value; fromInput.value = toInput.value; toInput.value = tmp;
});

document.querySelectorAll(".pick-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = btn.dataset.target;
    window.pickMode = (window.pickMode === target) ? null : target;
    document.querySelectorAll(".pick-btn").forEach(b => b.classList.toggle("active", window.pickMode && b === btn));
  });
});

function wirePlannerField(inputId, resultsId, target) {
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  input.addEventListener("input", () => {
    const q = input.value.trim();
    if (!fuse || !q) { results.style.display = "none"; return; }
    const matches = fuse.search(q).slice(0, 6);
    if (!matches.length) { results.style.display = "none"; return; }
    results.innerHTML = matches.map(m =>
      `<div class="result-item" data-idx="${m.item.idx}">
        ${stopTitleHtml(m.item.name)}<small>${m.item.routes.length ? "Jalur " + m.item.routes.join(", ") : "No routes listed"}</small>
      </div>`
    ).join("");
    results.style.display = "block";
  });
  results.addEventListener("click", (e) => {
    const item = e.target.closest(".result-item");
    if (!item) return;
    const s = STOPS[Number(item.dataset.idx)];
    if (!s) return;
    setPlanStop(target, s.name);
    results.style.display = "none";
  });
  input.addEventListener("blur", () => setTimeout(() => { results.style.display = "none"; }, 150));
}
wirePlannerField("plan-from", "plan-from-results", "from");
wirePlannerField("plan-to", "plan-to-results", "to");

document.getElementById("planner-find").addEventListener("click", () => {
  const out = document.getElementById("planner-output");
  resetPlannerHighlight();
  if (!planFrom || !planTo) {
    out.innerHTML = `<div class="planner-msg">Pick both a starting stop and a destination.</div>`;
    return;
  }
  const result = findStopPath(planFrom, planTo);
  if (!result) {
    out.innerHTML = `<div class="planner-msg">No route found between these stops.</div>`;
    return;
  }

  const legs = buildItinerary(result.edges);
  setPlannedRoute(legs);
  renderPlanMarkers(legs);
  // Truthy argument just means "dim every base route line uniformly" —
  // see setRouteDimming above; the actual colored path is the bold
  // planned-route overlay already drawn on top, not the dimmed base line.
  setRouteDimming(true);
  setRouteArrows(null);
  setStopsFilter([...new Set(legs.map(l => l.routeId))]);
  out.innerHTML = renderItinerary(legs, result.distance);

  const allCoords = legs.flatMap(l => l.coords);
  const lons = allCoords.map(c => c[0]), lats = allCoords.map(c => c[1]);
  map.fitBounds(
    [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    { padding: 70, maxZoom: 15, duration: 500 }
  );
});

// ---- Hidden shortcut: Ctrl+Alt+H opens the Haruno Cartography Editor ----
// (cartography.html) in a new tab. Global shortcut, not scoped to any one
// panel -- pressing it while the "Stop information" / "Show final
// destination" panel is open (or anywhere else) still opens the editor.
window.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "h") {
    e.preventDefault();
    // If the docked "Stop information" panel is currently open, carry its
    // stop over to the editor so it opens already showing that stop's
    // "Show final destination" view -- matching whatever was on screen
    // when the shortcut was pressed -- instead of a blank map.
    const stopName = (stopInfoPanel.style.display !== "none") ? stopInfoDestBtn.dataset.stop : "";
    const url = stopName ? `cartography.html?stop=${encodeURIComponent(stopName)}` : "cartography.html";
    window.open(url, "_blank");
  }
});
</script>
