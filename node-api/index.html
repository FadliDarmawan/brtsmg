      <div class="dest-label-full">${badges}<span class="dest-label-text">${label}</span></div>
      <span class="dest-label-dot" style="--pin-color:${color}"></span>
      <div class="dest-label-compact">${badges}</div>
    </div>
  `.trim();
  wrap.querySelectorAll(".dest-label-full, .dest-label-compact").forEach(wireDestLabelDrag);
  const marker = new maplibregl.Marker({ element: wrap.firstElementChild, anchor: "center" })
    .setLngLat(coord)
    .addTo(map);
  destLabelMarkers.push(marker);
}

window.showFinalDestinationsForStop = function (stopName) {
  const stopEntry = STOPS.find(s => s.name === stopName);
  if (!stopEntry) return;

  const routeIds = [];
  const activeSegments = [];
  // Stops that are still AHEAD from here -- i.e. actually reachable on
  // one of these forward legs -- not every stop the route ever touches
  // (which would include ones already passed, or ones on a leg/direction
  // headed the other way). Always include the selected stop itself since
  // it's the start of every leg being drawn.
  const willServeNames = new Set([stopName]);
  // destName -> { coord, routeIds: Set } -- collects, for each distinct
  // destination reached, every route id that leads there from this stop,
  // so PTC A's FD5+FD6 (say) don't each get their own overlapping pill
  // if they ever happened to share an endpoint; keyed by name since a
  // dual-pole junction's two destinations are different physical points
  // even when the routeId is the same.
  const destPoints = new Map();

  stopEntry.services.forEach(sv => {
    const routeId = sv.route;
    const meta = ROUTE_META[routeId];
    if (!meta) return;
    const dests = getStopDestinations(sv, stopName);
    if (!dests.length) return;
    if (!routeIds.includes(routeId)) routeIds.push(routeId);
    dests.forEach(dest => {
      const activeSeg = getForwardSegmentToDestination(routeId, stopName, dest);
      if (!activeSeg || !activeSeg.length) return;
      activeSegments.push({ coords: activeSeg, color: meta.color });
      getForwardStopNames(routeId, activeSeg).forEach(n => willServeNames.add(n));

      if (!destPoints.has(dest.name)) {
        // Pakai koordinat halte ASLI (dari STOPS/survei), BUKAN vertex garis
        // rute yang di-snap ke jalan oleh build-route-shapes.js -- dua
        // sumber itu sering beda beberapa meter (halte di pinggir jalan,
        // garis rute di tengah jalan), dan origin pill di bawah (baris
        // ~3892) sudah pakai koordinat asli juga -- jadi ini nyamain,
        // bukan nambah behavior baru. Fallback ke ujung segmen kalau
        // dest.name kebetulan bukan stop asli (mestinya gak kejadian buat
        // destinasi biasa, tapi jaga-jaga).
        const destStopEntry = STOPS.find(s => s.name === dest.name);
        const trueCoord = destStopEntry ? [destStopEntry.lon, destStopEntry.lat] : activeSeg[activeSeg.length - 1];
        destPoints.set(dest.name, { coord: trueCoord, routeIds: new Set() });
      }
      destPoints.get(dest.name).routeIds.add(routeId);
    });
  });

  if (!routeIds.length) return;
  window.lastActiveRouteIds = routeIds; // read by cartography.html's legend generator
  window.lastVisibleStopNames = [...willServeNames]; // read by cartography.html's draggable stop-label builder

  setActiveSegment(activeSegments);
  setBeforeSegment(null);
  // Unlike the plain "Stop information" overview (setRouteOverview), this
  // mode has nothing to show via the base route-line layer at all -- the
  // solid active-segment overlay above IS the whole picture now, so hide
  // every route's full shape outright (not just grey out the ones this
  // stop doesn't serve) rather than leaving it drawn underneath as
  // visual noise. setRouteArrows(null) matches: direction arrows come
  // from active-segment-arrows (scoped to just these solid legs) instead
  // of the base route-direction-arrows layer.
  setRouteArrows(null);
  map.setPaintProperty("route-line", "line-opacity", 0);
  setStopsFilterByNames([...willServeNames]);

  // Origin pill (every route being drawn, at the selected stop itself)
  // plus one pill per distinct destination reached, each tagged with
  // just the route(s) that actually lead there -- matches the reference
  // layout's floating "FD4 Kota Lama" / "FD7 Pasar Turi" callouts.
  clearDestLabels();
  addDestLabel([stopEntry.lon, stopEntry.lat], routeIds, getStopDisplay(stopName).base);
  destPoints.forEach(({ coord, routeIds: destRouteIds }, destName) => {
    addDestLabel(coord, [...destRouteIds], getStopDisplay(destName).base);
  });

  const allCoords = activeSegments.flatMap(s => s.coords);
  if (allCoords.length) {
    const lons = allCoords.map(c => c[0]), lats = allCoords.map(c => c[1]);
    map.fitBounds(
      [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
      { padding: 70, maxZoom: 15, duration: FIT_DURATION }
    );

  }
};


const stopInfoPanel = document.getElementById("stop-info-panel");
const stopInfoEyebrow = document.getElementById("stop-info-eyebrow");
const stopInfoTitle = document.getElementById("stop-info-title");
const stopInfoList = document.getElementById("stop-info-list");
const stopInfoDestBtn = document.getElementById("stop-info-dest-btn");

// Opened from a stop popup's "Stop information" button: does the same
// map dimming/fitBounds as highlightAllRoutesForStop above, but also
// swaps the floating pin popup out for this docked bottom-right panel
// (see the reference layout it's matching), listing each of the stop's
// routes next to that route's onward destination from here. Reuses the
// same per-route leg-end lookup the popup's plain (non-junction) dest-btn
// path uses — junction/hub-loop stops just fall back to no destination
// text for now, same as those cases already do elsewhere without a
// resolvable single leg end.
// Dipakai showPopup's "close" handler: true selama kita SENGAJA nutup
// popup sebagai bagian dari transisi yang mesti mempertahankan tag
// "stopPopup" di history (buka panel info, klik destinasi, dst) -- bukan
// dismiss organik (klik area kosong peta) yang justru harus membersihkan
// tag itu supaya hardware back nggak salah munculin popup yang memang
// udah ditutup sengaja. Lihat showPopup + ketiga tempat yang men-set ini.
let suppressStopPopupTagClear = false;

window.openStopInfoPanel = function (stopName) {
  const stopEntry = STOPS.find(s => s.name === stopName);
  if (!stopEntry) return;

  if (window.currentStopPopup) {
    suppressStopPopupTagClear = true; // pertahankan tag "stopPopup" -- lihat deklarasi flag ini
    window.currentStopPopup.remove();
    window.currentStopPopup = null;
    suppressStopPopupTagClear = false;
  }
  highlightAllRoutesForStop(stopName);
  // Popup.remove() above fires its "close" handler, which clears the
  // selected-stop highlight along with everything else -- reassert it
  // now that the panel (not the popup) is the thing showing this stop.
  setSelectedStop([stopEntry.lon, stopEntry.lat], stopName);

  // A single route can have more than one onward destination from this
  // exact stop -- e.g. T.O.W (FD8) also serves Romokalisari, Terminal
  // Benowo (R5) also serves Sumberejo, and PTC A (FD6) serves both the
  // Joyoboyo and Lakarsantri directions. getStopDestinations finds all of
  // them, so give each its own row (badge repeated) rather than folding
  // a route down to a single leg-end the way this used to.
  const rows = stopEntry.services
    .filter(sv => ROUTE_META[sv.route])
    .flatMap(sv => {
      const meta = ROUTE_META[sv.route];
      const dests = getStopDestinations(sv, stopName);
      const badge = `<span class="route-badge" style="color:${meta.color}; background:${meta.color}22; border-color:${meta.color}55;">${sv.route}</span>`;
      if (!dests.length) {
        return [`<div class="stop-info-row">${badge}<span class="stop-info-dest"></span></div>`];
      }
      return dests.map(d => `<div class="stop-info-row">${badge}<span class="stop-info-dest">${getStopDisplay(d.name).base}</span></div>`);
    }).join("");

  stopInfoEyebrow.textContent = "Rambu";
  stopInfoTitle.innerHTML = stopTitleHtml(stopName);
  stopInfoList.innerHTML = rows;
  stopInfoDestBtn.dataset.stop = stopName;
  // Always reopen in its default "show final destination" mode, even if
  // a previous stop was left toggled to "View passing routes" -- see the
  // click handler below for what the two modes do.
  stopInfoDestBtn.dataset.mode = "destination";
  stopInfoDestBtn.textContent = "Show final destination";
  stopInfoState = "open"; // clear any leftover "peek" (swiped-down) state from a previous open
  stopInfoPanel.style.transform = "";
  stopInfoPanel.dataset.state = "open";
  stopInfoPanel.style.display = "block";

  // Narrow viewports: the sheet (search box, "Plan a trip", route list,
  // and even its peeking drag-handle/title bar) would sit right on top
  // of this panel now that it's a full-width docked sheet itself, so
  // hide it outright rather than just dropping to its "hidden" state
  // (which still leaves the handle + title visible).
  if (mobileMQ.matches) mobileSheet.style.display = "none";
};

function closeStopInfoPanel() {
  stopInfoPanel.style.display = "none";
  stopInfoState = "open";
  stopInfoPanel.dataset.state = "";
  setActiveSegment(null);
  setBeforeSegment(null);
  setRouteOverview(null);
  setStopsFilter(null);
  clearDestLabels();
  setSelectedStop(null);
  if (mobileMQ.matches) {
    mobileSheet.style.display = "";
    applySheetState("peek");
  }
}
document.getElementById("stop-info-close").addEventListener("click", closeStopInfoPanel);

// Mobile-only swipe-down-to-HIDE: only the drag handle initiates this
// (not the header/Close button, so tapping Close still behaves
// normally). Unlike closeStopInfoPanel (the explicit "Close" button),
// swiping never resets the map back to its "home" view -- it just tucks
// the card down to a small peek strip (handle + eyebrow/close row +
// stop name) so the highlighted routes/stop stay exactly as they were
// and the person can glance at the map underneath. Swiping the peek
// strip back up, or tapping it, reopens the full card in place.
const stopInfoDragHandle = document.getElementById("stop-info-draghandle");
const stopInfoHeaderEl = document.getElementById("stop-info-header");
let stopInfoState = "open"; // "open" | "peek"
let stopInfoDrag = null;
let stopInfoJustDragged = false;

// How far down the card needs to slide so only the handle + header row
// + stop name remain visible -- measured live (rather than hardcoded)
// so it stays correct however long the title text wraps to.
function getStopInfoPeekShift() {
  const panelRect = stopInfoPanel.getBoundingClientRect();
  const titleRect = stopInfoTitle.getBoundingClientRect();
  const peekVisible = (titleRect.bottom - panelRect.top) + 10;
  return Math.max(0, panelRect.height - peekVisible);
}

function applyStopInfoState(state, animate = true) {
  stopInfoState = state;
  stopInfoPanel.dataset.state = state;
  stopInfoPanel.style.transition = animate ? "" : "none";
  stopInfoPanel.style.transform = state === "peek" ? `translateY(${getStopInfoPeekShift()}px)` : "";
  if (!animate) void stopInfoPanel.offsetHeight;
}

stopInfoDragHandle.addEventListener("pointerdown", (e) => {
  if (!mobileMQ.matches) return;
  stopInfoPanel.classList.add("dragging");
  stopInfoDrag = {
    startY: e.clientY,
    startShift: stopInfoState === "peek" ? getStopInfoPeekShift() : 0,
    peekShift: getStopInfoPeekShift(),
    panelH: stopInfoPanel.getBoundingClientRect().height,
    moved: false
  };
});
window.addEventListener("pointermove", (e) => {
  if (!stopInfoDrag) return;
  const dy = e.clientY - stopInfoDrag.startY;
  if (Math.abs(dy) > 3) stopInfoDrag.moved = true;
  const shift = Math.min(stopInfoDrag.panelH, Math.max(0, stopInfoDrag.startShift + dy));
  stopInfoPanel.style.transform = `translateY(${shift}px)`;
});
window.addEventListener("pointerup", (e) => {
  if (!stopInfoDrag) return;
  const dy = e.clientY - stopInfoDrag.startY;
  const shift = Math.min(stopInfoDrag.panelH, Math.max(0, stopInfoDrag.startShift + dy));
  const { peekShift } = stopInfoDrag;
  const moved = stopInfoDrag.moved;
  stopInfoPanel.classList.remove("dragging");
  stopInfoDrag = null;
  if (!moved) return; // a tap -- the click listeners below handle re-opening
  stopInfoJustDragged = true;
  setTimeout(() => { stopInfoJustDragged = false; }, 0);
  // Snap to whichever of the two resting shifts ("open" or "peek") is
  // nearer -- there's no third "fully closed" stop here; that only
  // happens via the explicit Close button.
  applyStopInfoState(shift > peekShift / 2 ? "peek" : "open");
});
window.addEventListener("pointercancel", () => {
  if (!stopInfoDrag) return;
  stopInfoDrag = null;
  stopInfoPanel.classList.remove("dragging");
  applyStopInfoState(stopInfoState, false);
});
// Tapping the peeked strip (handle, header row, or the stop name itself)
// reopens the full card -- mirrors the main sheet's hidden -> peek tap.
[stopInfoDragHandle, stopInfoHeaderEl, stopInfoTitle].forEach(el => {
  el.addEventListener("click", () => {
    if (stopInfoJustDragged) return;
    if (stopInfoState === "peek") applyStopInfoState("open");
  });
});

// Toggles between the two views the docked panel can drive: "Show final
// destination" draws every onward leg from this stop (see
// showFinalDestinationsForStop) and flips the button to "View passing
// routes"; tapping that runs the exact same "all routes at this stop"
// overview the "Stop information" popup button uses
// (highlightAllRoutesForStop) and flips the label back. dataset.mode
// tracks which action the button currently performs; openStopInfoPanel
// resets it to "destination" every time the panel opens for a stop.
stopInfoDestBtn.addEventListener("click", () => {
  const stopName = stopInfoDestBtn.dataset.stop;
  if (!stopName) return;
  if (stopInfoDestBtn.dataset.mode === "overview") {
    highlightAllRoutesForStop(stopName);
    stopInfoDestBtn.dataset.mode = "destination";
    stopInfoDestBtn.textContent = "Show final destination";
  } else {
    showFinalDestinationsForStop(stopName);
    stopInfoDestBtn.dataset.mode = "overview";
    stopInfoDestBtn.textContent = "View passing routes";
  }
});


// Resolves a ROUTE_HUB_LOOPS entry into real vertex numbers, working
// directly off lastStopVertex rather than the leg-boundary machinery above
// — see the comment on ROUTE_HUB_LOOPS for why this needs its own path.
// `hubVertex` is deliberately the hub stop's LAST occurrence (R5's second
// "Terminal Benowo", the mid-route hub — not its true start at vertex 0,
// which lv.startVertex already covers for the plain Tunjungan leg).
function getHubLoopVertices(routeId) {
  const cfg = ROUTE_HUB_LOOPS[routeId];
  const shape = ROUTE_SHAPES[routeId];
  const lv = getRouteLegVertices(routeId);
  if (!cfg || !shape || !lv) return null;
  const hubVertex = lastStopVertex(shape, cfg.hubStop);
  const waybackVertex = lastStopVertex(shape, cfg.wayback);
  if (hubVertex == null || waybackVertex == null) return null;
  return { hubVertex, waybackVertex, endVertex: lv.endVertex, waybackLegVertex: lv.waybackVertex, shape };
}

// Called from a hub stop's "→ Sumberejo"-style button (see ROUTE_HUB_LOOPS
// and showPopup). Draws the route's plain wayback point up to the hub's
// second occurrence dimmed (the rider is already past Tunjungan and headed
// back toward the terminal), then the hub's own out-and-back loop — hub ->
// its own wayback -> the route's real end — solid, since that's the actual
// destination leg being highlighted.
window.highlightRouteToHubLoop = function (routeId, fromStopName) {
  // Closes the popup first, same reasoning openRouteDetailFromStop has
  // for the plain (non-hub-loop) destination pick -- this is reached from
  // the same kind of popup "-> destination" button, so it had the exact
  // same "popup stays open and blocks the line" bug.
  if (window.currentStopPopup) {
    suppressStopPopupTagClear = true; // pertahankan tag "stopPopup" -- lihat deklarasi flag ini
    window.currentStopPopup.remove();
    window.currentStopPopup = null;
    suppressStopPopupTagClear = false;
  }
  if (fromStopName) {
    const fromEntry = STOPS.find(s => s.name === fromStopName);
    if (fromEntry) setSelectedStop([fromEntry.lon, fromEntry.lat], fromStopName);
  }

  const hv = getHubLoopVertices(routeId);
  if (!hv) return;
  const meta = ROUTE_META[routeId];
  const color = meta ? meta.color : null;

  const beforeSeg = hv.shape.coordinates.slice(hv.waybackLegVertex, hv.hubVertex + 1);
  const activeSeg = hv.shape.coordinates.slice(hv.hubVertex, hv.endVertex + 1);

  setActiveSegment(activeSeg, color);
  setBeforeSegment(beforeSeg, color);
  setRouteDimming(routeId);
  // Same forward-visible-but-greyed-behind treatment used elsewhere -- see
  // setStopsFilterByNamesWithPassed.
  const passedNames = (beforeSeg && beforeSeg.length) ? getForwardStopNames(routeId, beforeSeg) : [];
  setStopsFilterByNamesWithPassed(getForwardStopNames(routeId, activeSeg), passedNames);

  // Small "[route] destination" tag at this loop's actual endpoint, using
  // ROUTE_HUB_LOOPS' own label rather than trying to reverse-lookup a stop
  // name from endVertex.
  clearDestLabels();
  const cfg = ROUTE_HUB_LOOPS[routeId];
  if (activeSeg.length && cfg && cfg.label) {
    addDestLabel(activeSeg[activeSeg.length - 1], [routeId], getStopDisplay(cfg.label).base);
    quickDestinationPickActive = true;
  }

  const allCoords = [...beforeSeg, ...activeSeg];
  if (allCoords.length) {
    const lons = allCoords.map(c => c[0]), lats = allCoords.map(c => c[1]);
    map.fitBounds(
      [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
      { padding: 70, maxZoom: 15, duration: 500 }
    );
  }
};

// ---- Route detail view (hash-routed: index.html#/routes/<ID>) ---------
// Reached by picking a route (rail/search — see selectRouteFromRail) or
// by an old ?route=<id> link going through route.html's redirect. Rather
// than a separate page, this swaps #mobile-sheet's own search+toggle+
// route-list for #route-topbar + #route-detail-panel (both relocated to
// be ordinary children of #mobile-sheet itself, right next to
// #search-wrap's relocation — see the appendChild calls above), re-using
// the exact same overview/dim/filter machinery as the popup's "Stop
// information" button (setRouteOverview/setStopsFilter) — the same
// pattern busrouter.sg uses for #/ vs #/routes/<id>: picking a route
// re-renders this same map in place, nothing ever reloads.
const searchWrap = document.getElementById("search-wrap");
const routeTopbar = document.getElementById("route-topbar");
const routeBack = document.getElementById("route-back");
const routeHeading = document.getElementById("route-heading");
const routeSwitcher = document.getElementById("route-switcher");
const routeDetailPanel = document.getElementById("route-detail-panel");
const routeDetailTitle = document.getElementById("route-detail-title");
const routeDetailList = document.getElementById("route-detail-list");
const routeDetailTabs = document.getElementById("route-detail-tabs");

// Which leg of the currently-open route the list/map are showing --
// "all" (the whole loop), "up" (start -> wayback), or "down" (wayback ->
// end) — plus, if a stop's been clicked for the passed/remaining split
// (stage 3), that stop's own VERTEX (not name: a handful of stops
// legitimately sit on both legs under the same name, e.g. Ngabean, and
// vertex is the only unambiguous way to say which occurrence was
// clicked). Both reset every time a route is (re)opened or a leg tab is
// switched.
let routeDetailLeg = "all";
let routeDetailCurrentVertex = null;
// Set only when the route detail panel was opened from a stop popup's
// "-> destination" button (see openRouteDetailFromStop below) -- holds
// enough to reopen that exact popup (coords/name/services) when the
// panel's own back button is pressed, instead of collapsing all the way
// back to a blank map. openRouteDetail() clears this at the top of every
// normal entry (route switcher, search, rail badge, pasted link) since
// those never have a popup to go back to; openRouteDetailFromStop sets
// it again right after calling openRouteDetail(), so it survives that
// reset for its own flow specifically.
let routeDetailReturnStop = null;

// Parses "#/routes/FD8" -> "FD8". Matched case-insensitively so links
// typed/pasted in lowercase (or old ?route= links, which route.html
// uppercases before building the hash) still resolve — but the ORIGINAL
// casing from ROUTE_META's own keys is what gets returned, not the
// uppercased input. This matters because ROUTE_META's keys aren't all
// uppercase: "1A"/"L1"/etc. are, but "SiBulan 1", "SiBulan 2",
// "Transgama 1", "Transgama 2", "Transgama 3" are mixed-case with a
// space, and routeFileFor(id) uses this id verbatim to build the
// routes/<id>.json filename — matching against the wrong case would
// fail to fetch the file. Returns null for anything that isn't a
// recognized route, so a stale or mistyped id falls back to closing the
// detail view instead of rendering a blank panel.
const ROUTE_ID_BY_UPPER = Object.fromEntries(ROUTE_IDS.map(id => [id.toUpperCase(), id]));
function routeIdFromHash() {
  const m = /^#\/routes\/(.+)$/.exec(location.hash);
  if (!m) return null;
  const upper = decodeURIComponent(m[1]).toUpperCase();
  return ROUTE_ID_BY_UPPER[upper] || null;
}

function renderRouteSwitcher(activeId) {
  routeSwitcher.innerHTML = ROUTE_IDS.map(id => {
    const meta = ROUTE_META[id];
    const style = id === activeId
      ? `color:#fff;background:${meta.color};border-color:${meta.color};`
      : `color:${meta.color};background:${meta.color}22;border-color:${meta.color}55;`;
    return `<button class="rail-badge switcher-badge" data-route="${id}" style="${style}" title="${meta.title}">${id}</button>`;
  }).join("");
}

// Builds the "Full route" / "→ <wayback>" / "→ <start>" segmented control
// from that route's own ROUTE_DIRECTIONS entry. A handful of routes don't
// have one yet (see the ROUTE_DIRECTIONS comment) — for those there's no
// reliable up/down split to offer, so the control is just hidden and the
// list always shows the full route, same as before this feature existed.
// Reads ROUTE_META[id].schedule.hours (an array so a route can have more
// than one operating window in a day, e.g. SIBULAN1's two school-run
// windows) and joins it into one display string. Returns null for routes
// with no schedule.hours set at all, so callers can fall back to their
// own default label instead of showing an empty note.
function formatRouteHours(id) {
  const schedule = ROUTE_META[id] && ROUTE_META[id].schedule;
  if (!schedule || !schedule.hours || !schedule.hours.length) return null;
  return schedule.hours.join(", ");
}

function renderRouteDetailTabs(id) {
  const dirs = ROUTE_DIRECTIONS[id];
  if (!dirs) { routeDetailTabs.innerHTML = ""; routeDetailTabs.style.display = "none"; return; }
  routeDetailTabs.style.display = "flex";
  const tabs = [
    { key: "all", label: "Full route" },
    { key: "up", label: `→ ${getStopDisplay(dirs.wayback).base}` },
    { key: "down", label: `→ ${getStopDisplay(dirs.start).base}` }
  ];
  routeDetailTabs.innerHTML = tabs.map(t =>
    `<button data-leg="${t.key}" class="${t.key === routeDetailLeg ? "active" : ""}" title="${t.label}">${t.label}</button>`
  ).join("");
}

// Every stop this route serves, in travel order (see ROUTE_ORDERED_STOPS /
// extractOrderedStops) — including a name that legitimately appears twice
// (e.g. a hub stop like FD8's "T.O.W", or an outbound/return pass through
// the same junction), each as its own row. Filtered down to just one leg
// when routeDetailLeg isn't "all" (see getRouteLegVertices for the vertex
// range each leg covers), and each row gets a small route-badge for every
// OTHER route that also serves that stop — a quick "you can transfer
// here" hint, same badges used for the destination pills elsewhere.
function renderRouteDetailList(id) {
  let stops = ROUTE_ORDERED_STOPS[id] || [];
  if (routeDetailLeg !== "all") {
    const lv = getRouteLegVertices(id);
    if (lv) {
      const lo = routeDetailLeg === "up" ? lv.startVertex : lv.waybackVertex;
      const hi = routeDetailLeg === "up" ? lv.waybackVertex : lv.endVertex;
      stops = stops.filter(s => s.vertex >= Math.min(lo, hi) && s.vertex <= Math.max(lo, hi));
    }
  }
  // Halte mana yang ada bus-nya SEKARANG -- dicocokkan dari nearestStopName
  // yang di-cache tiap poll (lihat pollBusLocations), dibatasi ke bus yang
  // route_id-nya cocok rute ini DAN (leg "all" atau arahnya cocok leg yang
  // lagi dibuka) -- filter yang SAMA persis dipakai busShouldBeVisible,
  // jadi badge di daftar ini konsisten sama bus yang kelihatan di peta.
  const busesAtStop = {}; // { [stopName]: [{busId,color}, ...] }
  for (const [busId, loc] of Object.entries(busLatestLoc)) {
    if (!loc || !loc.nearestStopName || !busShouldBeVisible(loc)) continue;
    (busesAtStop[loc.nearestStopName] ||= []).push({ busId, color: BUS_INSTANCES[busId].color });
  }

  // Re-rendering this list (e.g. every time a stop row is clicked, to
  // update the passed/current highlighting) used to reset scrollTop to 0
  // via the innerHTML replacement below -- which felt like the whole
  // panel "collapsed" back to the top whenever a stop deep in a long list
  // was clicked. Save/restore the scroll position around the rebuild so
  // clicking a stop just updates its highlighting in place.
  const prevScrollTop = routeDetailList.scrollTop;
  routeDetailList.innerHTML = stops.map((s, i) => {
    const stopEntry = STOPS.find(st => st.name === s.name);
    const sv = stopEntry ? stopEntry.services.find(x => x.route === id) : null;
    const hub = sv && sv.is_departure_hub ? `<span class="hub-tag">Hub</span>` : "";
    const transferIds = stopEntry
      ? [...new Set(stopEntry.services.filter(x => x.route !== id).map(x => x.route))]
      : [];
    const badges = transferIds.map(routeBadgeHtml).join("");
    const busesHere = busesAtStop[s.name] || [];
    const busBadges = busesHere
      .map(b => `<span class="stop-bus-badge" style="background:${b.color}" title="${BUS_INSTANCES[b.busId].label} ada di sini">🚌</span>`)
      .join("");
    const passed = routeDetailCurrentVertex != null && s.vertex < routeDetailCurrentVertex;
    const current = s.vertex === routeDetailCurrentVertex;
    const rowClass = ["route-detail-row", passed ? "is-passed" : "", current ? "is-current" : ""]
      .filter(Boolean).join(" ");
    return `<button class="${rowClass}" data-name="${s.name}" data-vertex="${s.vertex}">
      <span class="route-detail-index">${i + 1}</span>
      ${busBadges}
      <span class="route-detail-name">${stopTitleHtml(s.name)}</span>
      ${hub}
      ${badges ? `<span class="route-detail-badges">${badges}</span>` : ""}
    </button>`;
  }).join("");
  routeDetailList.scrollTop = prevScrollTop;
}

// Stage 2: switches between the full loop and a single leg (toward the
// wayback point, or toward the start/end) — re-fits the map to just that
// stretch and highlights only it, same visual language as a destination
// pick elsewhere (dim everything else, draw this stretch in full color).
// Always drops any stage-3 passed/remaining selection, since that's
// relative to a specific stop that may not even be visible in the new leg.
function applyRouteDetailLeg(id, leg) {
  routeDetailLeg = leg;
  routeDetailCurrentVertex = null;
  setSelectedStop(null);
  renderRouteDetailTabs(id);
  renderRouteDetailList(id);
  updateBusMarkerVisibility(); // rute/arah baru dibuka -- filter bus langsung, jangan nunggu poll berikutnya

  const meta = ROUTE_META[id];
  const shape = ROUTE_SHAPES[id];
  const lv = getRouteLegVertices(id);

  if (leg === "all" || !lv) {
    setActiveSegment(null);
    setBeforeSegment(null);
    setRouteOverview([id]);
    setStopsFilter(id);
    const coords = (ROUTE_LINES[id] || []).flat();
    if (coords.length) {
      const lons = coords.map(c => c[0]), lats = coords.map(c => c[1]);
      map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
        { padding: 70, maxZoom: 15, duration: 500 });
    }
    return;
  }

  const lo = leg === "up" ? lv.startVertex : lv.waybackVertex;
  const hi = leg === "up" ? lv.waybackVertex : lv.endVertex;
  const legCoords = shape.coordinates.slice(Math.min(lo, hi), Math.max(lo, hi) + 1);

  // "__none__" never matches a real route id, so this greys out every
  // route including this one's own base line -- the leg itself is drawn
  // separately (in full color) via the active-segment layer instead.
  setRouteOverview(["__none__"]);
  setBeforeSegment(null);
  setActiveSegment([{ coords: legCoords, color: meta.color }]);
  setStopsFilterByNames(getForwardStopNames(id, legCoords));

  if (legCoords.length) {
    const lons = legCoords.map(c => c[0]), lats = legCoords.map(c => c[1]);
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
      { padding: 70, maxZoom: 15, duration: 500 });
  }
}

// Stage 3: clicking a stop row splits the trip around it -- everything
// from the start of its leg up to (and including) this stop dims grey as
// "already passed", and this stop onward to the end of its leg draws
// solid/full-color as what's still ahead. Works no matter which tab is
// currently showing (the stop's own vertex says which leg it's actually
// on, via the same startVertex/waybackVertex/endVertex boundaries
// getRouteLegBounds uses elsewhere) and reuses the exact
// before/active-segment + passed-stops machinery the "Show final
// destination" flow already relies on.
function selectRouteDetailStop(id, vertex) {
  const meta = ROUTE_META[id];
  const shape = ROUTE_SHAPES[id];
  const lv = getRouteLegVertices(id);
  if (!meta || !shape || !lv || vertex == null) return;

  // Strict less-than to match getRouteLegBounds' own convention
  // elsewhere: clicking exactly ON the wayback stop means "the leg ahead
  // of it" (down), not "the leg that just ended here" (up).
  const onUpLeg = vertex < lv.waybackVertex;
  const legLo = onUpLeg ? lv.startVertex : lv.waybackVertex;
  const legHi = onUpLeg ? lv.waybackVertex : lv.endVertex;

  // Two different slices on purpose: the LINE needs to touch the clicked
  // stop's exact coordinate on both sides (passedLineCoords includes it)
  // so the dimmed and solid strands visually meet with no gap -- but that
  // means the clicked stop's own NAME would otherwise land in both the
  // "passed" and "remaining" name sets at once. setStopsPassedNames only
  // checks passed-membership, so it was dimming the very stop that's
  // supposed to be the highlighted anchor. passedNameCoords deliberately
  // stops one vertex short so the clicked stop's name only ever counts as
  // "remaining".
  const passedLineCoords = shape.coordinates.slice(legLo, vertex + 1);
  const passedNameCoords = shape.coordinates.slice(legLo, vertex);
  const remainingCoords = shape.coordinates.slice(vertex, legHi + 1);

  setBeforeSegment(passedLineCoords.length > 1 ? [{ coords: passedLineCoords, color: meta.color }] : null);
  setActiveSegment([{ coords: remainingCoords, color: meta.color }]);
  setStopsFilterByNamesWithPassed(
    getForwardStopNames(id, remainingCoords),
    getForwardStopNames(id, passedNameCoords)
  );

  routeDetailCurrentVertex = vertex;
  // Gives the clicked stop its own unambiguous ring on the map (the same
  // marker showPopup uses elsewhere for "this is the one you picked"),
  // on top of "not dimmed" -- since every other remaining stop is ALSO
  // not dimmed, opacity alone doesn't clearly single this one out.
  // Pakai koordinat halte ASLI (STOPS), BUKAN coordAtVertex (posisi
  // ke-snap ke garis rute oleh build-route-shapes.js) -- dua sumber itu
  // bisa beda beberapa meter kalau titik survei halte gak persis nempel
  // di tengah jalan. Semua pemanggilan setSelectedStop LAIN di file ini
  // udah pakai koordinat asli (lihat baris ~4025, ~4224); ini nyamain,
  // bukan behavior baru -- biar cincin highlight-nya ketemu di titik
  // yang sama persis kayak dot halte-nya, bukan geser ke tengah jalan.
  const stopAtVertex = (ROUTE_ORDERED_STOPS[id] || []).find(s => s.vertex === vertex);
  if (stopAtVertex) {
    const trueEntry = STOPS.find(s => s.name === stopAtVertex.name);
    const coordAtVertex = shape.coordinates[vertex];
    setSelectedStop(trueEntry ? [trueEntry.lon, trueEntry.lat] : coordAtVertex, stopAtVertex.name);
  }
  renderRouteDetailList(id);
}

function openRouteDetail(id) {
  const meta = ROUTE_META[id];
  if (!meta || !ROUTE_SHAPES[id]) return false;

  // Any entry into route detail through the normal hash-routed path
  // (route switcher, search result, rail badge, pasted/refreshed link)
  // starts with a clean slate -- there's no popup to go back to. Only
  // openRouteDetailFromStop re-sets this, and only AFTER this call
  // returns, so its context survives.
  routeDetailReturnStop = null;

  setRailExpanded(false);
  // Route content now lives INSIDE #mobile-sheet rather than floating
  // over it, so opening a route needs the sheet expanded (not hidden) --
  // and its own search/toggle/route-list hidden while the route's own
  // back button/heading/switcher/stop-list take their place instead.
  searchWrap.style.display = "none";
  sheetToggle.style.display = "none";
  mobileRouteList.style.display = "none";
  routeTopbar.style.display = "flex";
  routeDetailPanel.style.display = "flex";
  stopInfoPanel.style.display = "none";
  applySheetState("full");

  routeHeading.innerHTML = `<span class="rail-badge" style="color:${meta.color};background:${meta.color}22;border-color:${meta.color}55;">${id}</span><span>${meta.title}</span>`;
  const hours = formatRouteHours(id);
  routeDetailTitle.textContent = hours ? `Stops along this route · ${hours}` : "Stops along this route";
  renderRouteSwitcher(id);
  applyRouteDetailLeg(id, "all"); // also renders the tabs + list and fits the map
  scrollRouteDetailToBus(id);
  return true;
}

// Sekali aja pas rute baru dibuka (bukan tiap refresh tick -- itu udah
// dijaga sendiri lewat prevScrollTop di renderRouteDetailList), geser
// daftar halte ke baris yang ada badge bus-nya, biar nggak perlu nyari
// manual di antara puluhan halte.
function scrollRouteDetailToBus(id) {
  const hasBus = Object.entries(busLatestLoc).some(
    ([busId, loc]) => loc && loc.routeId === id && loc.nearestStopName
  );
  if (!hasBus) return;
  requestAnimationFrame(() => {
    const badgeEl = routeDetailList.querySelector(".stop-bus-badge");
    if (badgeEl) badgeEl.closest(".route-detail-row")?.scrollIntoView({ block: "center" });
  });
}

function closeRouteDetail() {
  routeTopbar.style.display = "none";
  routeDetailPanel.style.display = "none";
  searchWrap.style.display = "";
  sheetToggle.style.display = "";
  mobileRouteList.style.display = "";
  applySheetState("peek");
  routeDetailLeg = "all";
  routeDetailCurrentVertex = null;
  setActiveSegment(null);
  setBeforeSegment(null);
  setRouteOverview(null);
  setStopsFilter(null);
  setSelectedStop(null);
  updateBusMarkerVisibility(); // balik ke plain view -- semua bus tampil lagi
}

// Called from a stop popup's "-> destination" button (see showPopup) in
// place of the old highlightRouteToDestination quick-highlight: instead
// of just drawing a highlighted segment + floating endpoint badge (which
// needed the popup to close to avoid covering the line, and then had no
// good way back to "the stop popup I started from"), this opens the SAME
// full route detail panel a rider gets from the route list/search --
// already switched to the right "-> destination" leg tab and scrolled/
// highlighted to this exact stop, matching what manually opening the
// route and clicking that row would produce. routeBack's own click
// handler (below) is what makes the panel's "<- All routes" button
// return to this popup instead of collapsing everything.
window.openRouteDetailFromStop = function (routeId, fromStopName, toStopName) {
  const stopEntry = STOPS.find(s => s.name === fromStopName);
  if (!stopEntry) return;
  const resolved = toStopName ? resolveStopLegVertex(routeId, fromStopName, toStopName) : null;

  // Captured now, before the popup closes, since STOPS is the only place
  // holding this stop's coords + full services list (the popup itself
  // doesn't stash them anywhere retrievable).
  const returnStop = { coords: [stopEntry.lon, stopEntry.lat], name: fromStopName, services: stopEntry.services };
  if (window.currentStopPopup) {
    suppressStopPopupTagClear = true; // pertahankan tag "stopPopup" -- lihat deklarasi flag ini
    window.currentStopPopup.remove();
    window.currentStopPopup = null;
    suppressStopPopupTagClear = false;
  }

  // Changes the URL WITHOUT going through the normal hashchange ->
  // applyHash() path (that path is asynchronous -- the hashchange event
  // fires on a later tick -- so calling openRouteDetail() ourselves right
  // below stays perfectly in sync with the rest of this function instead
  // of racing a second, delayed openRouteDetail() call triggered by the
  // hash assignment).
  //
  // pushState (NOT replaceState) on purpose: this needs to become a real,
  // separate history entry stacked ON TOP of the Home entry we just tagged
  // with the stopPopup info above (via showPopup's replaceState) -- so
  // that hardware/gesture back has somewhere to land instead of exiting
  // the app outright. See the popstate listener near applyHash for the
  // other half of this.
  history.pushState({ type: "routeFromStop" }, "", location.pathname + location.search + `#/routes/${encodeURIComponent(routeId)}`);
  if (!openRouteDetail(routeId)) return;
  if (resolved) {
    applyRouteDetailLeg(routeId, resolved.leg);
    selectRouteDetailStop(routeId, resolved.vertex);
  }
  // Set AFTER openRouteDetail(), which clears this at its own top for
  // every OTHER entry point -- this is the one flow meant to keep it.
  routeDetailReturnStop = returnStop;
};

// The single entry point for reacting to the current hash — called once
// after routes finish loading (map "load" handler below) and again on
// every hashchange (back/forward, the switcher, a pasted link).
//
// suppressApplyHashOnce: set by the popstate listener right below while
// it's restoring a tagged stop popup -- a hashchange for that SAME
// back/forward navigation fires too (same event loop turn, order between
// the two isn't guaranteed across browsers), and if it ran its own default
// closeRouteDetail() afterwards, that would wipe the setSelectedStop
// highlight showPopup just set. Reset on a setTimeout(0) rather than
// immediately so it stays true regardless of which of the two events
// (popstate vs hashchange) happens to fire second.
let suppressApplyHashOnce = false;
function applyHash() {
  if (suppressApplyHashOnce) return;
  const id = routeIdFromHash();
  if (!id || !openRouteDetail(id)) closeRouteDetail();
}
window.addEventListener("hashchange", applyHash);

// Other half of the "back from a stop-opened route detail should return
// to that exact stop popup, not exit the app" fix -- see showPopup
// (tags the Home entry via replaceState) and openRouteDetailFromStop
// (pushState's a real new entry on top of it). Landing back on that
// tagged entry (hardware/gesture back, or history.back() from anywhere)
// fires this with the stashed stop info, so we can reconstruct the exact
// popup instead of leaving a blank map -- or worse, letting the browser
// fall through to whatever was open before this app entirely.
window.addEventListener("popstate", (e) => {
  if (e.state && e.state.type === "stopPopup" && e.state.stop) {
    suppressApplyHashOnce = true;
    closeRouteDetail();
    const { coords, name, services } = e.state.stop;
    showPopup(coords, name, services);
    setTimeout(() => { suppressApplyHashOnce = false; }, 0);
  }
});

routeBack.addEventListener("click", () => {
  // Opened from a stop popup's "-> destination" button -- go back to
  // that exact popup instead of collapsing all the way to a blank map.
  // closeRouteDetail() is called directly (not via location.hash, which
  // would fire the async hashchange -> applyHash() path and risk it
  // running AFTER showPopup below, wiping out the very popup/selection
  // state showPopup just set).
  if (routeDetailReturnStop) {
    const { coords, name, services } = routeDetailReturnStop;
    routeDetailReturnStop = null;
    closeRouteDetail();
    history.replaceState(null, "", location.pathname + location.search + "#/");
    showPopup(coords, name, services);
    return;
  }
  location.hash = "#/";
});


routeSwitcher.addEventListener("click", (e) => {
  const btn = e.target.closest(".switcher-badge");
  if (!btn) return;
  location.hash = `#/routes/${encodeURIComponent(btn.dataset.route)}`;
});

routeDetailTabs.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-leg]");
  if (!btn) return;
  const id = routeIdFromHash();
  if (id) applyRouteDetailLeg(id, btn.dataset.leg);
});

routeDetailList.addEventListener("click", (e) => {
  const row = e.target.closest(".route-detail-row");
  if (!row) return;
  const s = STOPS.find(st => st.name === row.dataset.name);
  const id = routeIdFromHash();
  if (s) map.flyTo({ center: [s.lon, s.lat], zoom: 15, speed: 1.2 });
  if (id) selectRouteDetailStop(id, Number(row.dataset.vertex));
});

const signIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15V4h13l3 3-3 3H4"/><path d="M8 21V4"/></svg>`;
const calendarIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>`;
const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;

// Escapes a value for safe embedding inside a single-quoted JS string
// literal within an inline onclick="..." attribute.
function jsStr(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

// Puts (or clears) the big highlighted ring on top of whichever stop is
// currently open in a popup or the docked "Stop information" panel --
// see the selected-stop-halo/-ring layers added above. Pass no args (or
// null coords) to clear it.
function setSelectedStop(coords, name) {
  const src = map.getSource("selected-stop");
  if (!src) return;
  src.setData({
    type: "FeatureCollection",
    features: coords ? [{ type: "Feature", geometry: { type: "Point", coordinates: coords }, properties: { name: name || "" } }] : []
  });
}

// Works out every onward destination a given service (one route at one
// stop) actually has FROM this stop — not just the one getRouteLegBounds
// resolves to a single leg-end. A stop can legitimately have more than
// one destination for the very same route:
//   - a same-name dual-pole junction, where this stop's name occurs more
//     than once along the route's own shape (e.g. PTC A on FD6: one
//     occurrence heads toward Joyoboyo, the other toward Lakarsantri) —
//     detected the same shape-occurrence way showPopup's destPart does;
//   - a stop with a manual multi-destination list in stops.json
//     (sv.destinations.length > 1) whose leg-start/leg-end both resolve
//     to real onward termini;
//   - a ROUTE_HUB_LOOPS hub stop (e.g. T.O.W on FD8 -> also Romokalisari;
//     Terminal Benowo on R5 -> also Sumberejo), which has a genuine
//     second out-and-back leg the leg-boundary math above can't express
//     on its own.
// Returns a de-duplicated list of { name, isHubLoop } — isHubLoop marks
// entries that need highlightRouteToHubLoop rather than
// openRouteDetailFromStop when made clickable. Shared by showPopup
// (renders each as a "-> destination" button) and openStopInfoPanel
// (renders each as its own route/destination row).
function getStopDestinations(sv, name) {
  // Rute loop tunggal (ROUTE_LOOP_LABEL) -- short-circuit total, gak lewat
  // logic leg/hub-loop di bawah sama sekali. SEMUA halte di rute ini
  // nunjukin destinasi yang SAMA, apapun posisinya.
  if (ROUTE_LOOP_LABEL[sv.route]) {
    return [{ name: ROUTE_LOOP_LABEL[sv.route], isHubLoop: false, isFixedLoop: true }];
  }

  const dests = [];
  const seen = new Set();
  const addDest = (destName, isHubLoop) => {
    if (!destName || destName === name || seen.has(destName)) return;
    seen.add(destName);
    dests.push({ name: destName, isHubLoop: !!isHubLoop });
  };

  const leg = getRouteLegBounds(sv.route, name);
  const shape = ROUTE_SHAPES[sv.route];
  const lv = getRouteLegVertices(sv.route);
  const occurrences = shape ? shape.stopIndex.get(name) : null;

  if (occurrences && occurrences.length > 1 && lv) {
    occurrences.forEach(v => {
      const legEnd = v < lv.waybackVertex ? lv.wayback : lv.end;
      addDest(legEnd, false);
    });
  } else if (Array.isArray(sv.destinations) && sv.destinations.length > 1) {
    const legEndName = leg ? leg.legEndName : null;
    const legStartName = leg ? leg.legStartName : null;
    const nextLegStart = legStartName && legStartName !== name && findLegEntryStop(sv.route, name, legStartName)
      ? legStartName
      : null;
    addDest(legEndName, false);
    addDest(nextLegStart, false);
  } else {
    addDest(leg ? leg.legEndName : null, false);
  }

  // Genuine second onward direction from a hub-loop stop -- not covered
  // by any of the branches above (see ROUTE_HUB_LOOPS).
  const hubLoop = ROUTE_HUB_LOOPS[sv.route];
  if (hubLoop && name === hubLoop.hubStop) {
    addDest(hubLoop.label, true);
  }

  return dests;
}

// Keeps the "STOPS ALONG THIS ROUTE" list in sync when a stop is picked
// some other way than clicking its own row -- a map marker, a search
// result, etc. showPopup (below) unconditionally resets the active/before
// segments and stops filter, which -- while a route detail panel is open
// -- undid whatever route/leg highlighting was on screen and left the
// list's own "current" row stuck on whatever was last clicked there. That
// read as the whole route view "collapsing" back to a plain map. This
// re-runs the exact same "select this stop" logic a row click uses
// (restoring the route highlighting) and scrolls the matching row into
// view as the selected one, instead of leaving that state undone.
function syncRouteDetailSelection(coords, name) {
  const id = routeIdFromHash();
  if (!id) return;
  const matches = (ROUTE_ORDERED_STOPS[id] || []).filter(s => s.name === name);
  if (!matches.length) return;
  // Disambiguate dual-pole stops (same name, multiple vertices) by
  // picking whichever occurrence's shape coordinate is closest to the
  // marker that was actually clicked.
  const shape = ROUTE_SHAPES[id];
  let best = matches[0], bestDist = Infinity;
  matches.forEach(m => {
    const c = shape && shape.coordinates[m.vertex];
    if (!c) return;
    const d = (c[0] - coords[0]) ** 2 + (c[1] - coords[1]) ** 2;
    if (d < bestDist) { bestDist = d; best = m; }
  });
  selectRouteDetailStop(id, best.vertex);
  // showPopup (the caller) just reset route-line dimming back to normal
  // for every route via setRouteDimming(null) -- selectRouteDetailStop
  // only manages the active/before overlay segments, not the base
  // dimming, so without this the untouched rest of every OTHER route
  // would sit at full color/opacity again, fighting the highlighted one
  // for attention. Restore whichever dimming the current tab implies:
  // "Full route" still shows this route's own base line in color, while
  // a specific up/down leg dims even this route's base line (its leg is
  // drawn by the active/before overlay instead).
  setRouteOverview(routeDetailLeg === "all" ? [id] : ["__none__"]);
  const row = routeDetailList.querySelector(`.route-detail-row[data-vertex="${best.vertex}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

// Looks across every route serving this stop for a real departures list
// (see extractOrderedStops -- currently only SIBULAN2's two termini carry
// one). Returns the first match; a stop with a real fixed timetable on
// more than one serving route isn't a case that exists yet, so this
// doesn't try to merge/list several.
function getStopDepartures(name, services) {
  for (const sv of services) {
    const stops = ROUTE_ORDERED_STOPS[sv.route] || [];
    const match = stops.find(s => s.name === name && Array.isArray(s.departures) && s.departures.length);
    if (match) return { routeId: sv.route, departures: match.departures };
  }
  return null;
}

function showPopup(coords, name, services) {
  stopHoverPopup.remove();
  if (stopInfoPanel) stopInfoPanel.style.display = "none";

  setActiveSegment(null);

  setRouteDimming(null);
  setStopsFilter(null);
  setPlannedRoute(null);
  clearPlanMarkers();
  clearDestLabels();
  setSelectedStop(coords, name);
  syncRouteDetailSelection(coords, name);

  // No route in this fork uses the "inactive on some days" stop pattern
  // yet -- SIBULAN1/SIBULAN2 dim as whole routes instead (see
  // isRouteActiveToday), not per-stop. Kept as an explicit false, matching
  // buildStopsGeoJSON's `inactive` flag, rather than deleted outright, so
  // it's obvious where a future per-stop version would plug back in.
  const isWeekendOnlyInactive = false;

    ? `<div class="popup-timetable">

    : "";

  const activeRouteId = routeIdFromHash();
  const badges = services.length
    ? services.map(sv => {
        const meta = ROUTE_META[sv.route];
        const color = meta ? meta.color : "#888";
        const hub = sv.is_departure_hub ? `<span class="hub-tag">Hub</span>` : "";
        // A stop counts as a "junction" for this route if stops.json lists
        // more than one entry in that service's own destinations — a real
        // fork, not just the next stop along a single line (see Bandara
        // Adisujtipto and Janti Selatan on 1A). At a junction, show a
        // button for every leg-boundary terminus on the route so the
        // rider can pick either onward direction.
        const waypoints = ROUTE_WAYPOINTS[sv.route] || [];

        // See getStopDestinations for the full breakdown of why a single
        // route can have more than one onward destination from the very
        // same physical stop (dual-pole junctions like PTC A on FD6,
        // manual multi-destination stops, and hub-loop stops like T.O.W
        // or Terminal Benowo) — one button per destination it finds.
        const destPart = getStopDestinations(sv, name).map(d =>
          d.isFixedLoop
            ? `<button class="dest-btn" onclick="openRouteDetailFromStop('${jsStr(sv.route)}','${jsStr(name)}')">&rarr; ${d.name}</button>`
            : d.isHubLoop
            ? `<button class="dest-btn" onclick="highlightRouteToHubLoop('${jsStr(sv.route)}','${jsStr(name)}')">&rarr; ${d.name}</button>`
            : `<button class="dest-btn" onclick="openRouteDetailFromStop('${jsStr(sv.route)}','${jsStr(name)}','${jsStr(d.name)}')">&rarr; ${getStopDisplay(d.name).base}</button>`
        ).join("");
        // Skip the colored route-badge pill for the route whose detail
        // panel is already open -- the sidebar's rail badge + breadcrumb
        // already say "you're looking at R1", so repeating "R1" on every
        // single stop's popup added nothing. Other routes serving this
        // stop (transfers) still get their badge, since that's the only
        // place this popup mentions them.
        const badge = sv.route === activeRouteId
          ? ""
          : `<span class="route-badge" style="color:${color}; background:${color}22; border-color:${color}55;">${sv.route}</span>`;
        return `<div class="service-row">
          ${badge}
          ${destPart}
          ${hub}
        </div>`;
      }).join("")
    : `<div class="no-service">No routes listed for this stop</div>`;

  const [lon, lat] = coords;
  const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
  window.currentStopPopup = new maplibregl.Popup({ closeButton: false, offset: 14, className: "glass-popup" })
    .setLngLat(coords)
    .setHTML(`
      <div class="glass-tag">
        <div class="tag-eyebrow">Rambu</div>
        <div class="popup-title">${stopTitleHtml(name)}</div>
        ${scheduleNote}
        ${timetableNote}
        <div class="popup-routes">${badges}</div>
        <div class="popup-actions">
          <button class="popup-btn" onclick="openStopInfoPanel('${jsStr(name)}')">Stop information</button>
          <button class="popup-link" onclick="window.open('${mapsUrl}', '_blank')">Open in Google Maps</button>
        </div>
      </div>
    `)
    // Kalau popup ini ditutup ORGANIK (klik area kosong peta -- MapLibre
    // auto-close popup by default), bersihin tag "stopPopup" di history
    // entry sekarang, supaya nanti hardware back TIDAK salah muncul lagi
    // popup yang memang udah sengaja ditutup. Tapi kalau .remove() ini
    // dipanggil sebagai BAGIAN dari transisi yang justru harus MEMPERTAHANKAN
    // tag itu (buka panel info, klik destinasi -> route detail, dst),
    // pemanggilnya set suppressStopPopupTagClear = true dulu -- lihat
    // ketiga tempat yang melakukan itu.
    .on("close", () => {
      setActiveSegment(null); setBeforeSegment(null); setRouteDimming(null); setStopsFilter(null); setSelectedStop(null);
      if (!suppressStopPopupTagClear) history.replaceState(null, "", location.hash || "#/");
    })
    .addTo(map);
  // Tag entry HISTORY yang lagi aktif sekarang dengan popup ini, supaya
  // kalau user nanti pencet back (hardware/gesture) dan balik lagi ke
  // entry ini, popstate listener di bawah tahu harus munculin popup halte
  // ini lagi -- bukan cuma nutup semuanya / keluar aplikasi. Pakai
  // replaceState (bukan pushState) karena ini bukan navigasi baru, cuma
  // nempelin catatan ke entry yang SUDAH ada.
  history.replaceState({ type: "stopPopup", stop: { coords, name, services } }, "", location.hash || "#/");
}

// ---- 4. Trip planner (multi-route pathfinding) --------------------------
// Finds the shortest ride across the whole network, transferring between
// as many routes as needed, using nothing but the same per-route shape
// data (ROUTE_SHAPES) and stop list (STOPS) already loaded above.

// Great-circle distance in meters between two [lon,lat] points.
function haversine(a, b) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[1] - a[1]), dLon = toRad(b[0] - a[0]);
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(a[1])) * Math.cos(toRad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// Nearest STOPS entry (by straight-line distance) to a route-shape vertex,
// within maxMeters. Matching by COORDINATE rather than by name is
// deliberate: a route file's own stop spelling isn't always trustworthy
// (see the 5B/1B "Adisujtipto" vs "Adisutjipto" typo from earlier), but
// build-route-shapes.js snaps every named vertex precisely onto its real
// stop location, so physical proximity is a far more reliable join key
// than string matching across files that don't always agree on spelling.
function nearestStopName(coord, maxMeters = 60) {
  let best = null, bestDist = Infinity;
  for (const s of STOPS) {
    const d = haversine(coord, [s.lon, s.lat]);
    if (d < bestDist) { bestDist = d; best = s.name; }
  }
  return bestDist <= maxMeters ? best : null;
}

function pathLength(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) d += haversine(coords[i - 1], coords[i]);
  return d;
}

// Directed adjacency list: canonical stop name -> [{ to, routeId, weight,
// coords }]. Directed because every Trans Jogja corridor is a one-way
// loop (see ROUTE_DIRECTIONS) — a stop only ever leads FORWARD to the
// next stop along that route's own direction of travel. Transfers aren't
// a separate edge type; they fall out naturally, since two different
// routes' edges can share the same canonical `to`/`from` stop name.
let STOP_GRAPH = new Map();
window.STOP_GRAPH = STOP_GRAPH; // debug: cek di console via STOP_GRAPH.size / STOP_GRAPH

function addEdge(from, to, routeId, weight, coords) {
  if (!from || !to || from === to || !(weight > 0)) return;
  if (!STOP_GRAPH.has(from)) STOP_GRAPH.set(from, []);
  STOP_GRAPH.get(from).push({ to, routeId, weight, coords });
}

function buildStopGraph() {
  STOP_GRAPH = new Map();
  window.STOP_GRAPH = STOP_GRAPH; // re-sync: reassigned above, not just mutated
  for (const routeId of Object.keys(ROUTE_SHAPES)) {
    const shape = ROUTE_SHAPES[routeId];
    // [name, vertex] pairs, in travel order (every route's shape is one
    // continuous directional line — see the loop comment near
    // ROUTE_DIRECTIONS above). Flattened across ALL occurrences of each
    // name, not just one — a stop like Ngabean on route 15 is genuinely
    // visited twice (once per direction), and both visits need their own
    // edges for the graph to find a path through whichever one actually
    // connects to where the rider's headed.
    const entries = [];
    shape.stopIndex.forEach((vertices, name) => {
      vertices.forEach(vertex => entries.push([name, vertex]));
    });
    entries.sort((a, b) => a[1] - b[1]);
    if (entries.length < 2) continue;

    const resolved = entries.map(([name, vertex]) => ({
      vertex,
      canonical: nearestStopName(shape.coordinates[vertex]) || name
    }));

    for (let i = 0; i < resolved.length - 1; i++) {
      const a = resolved[i], b = resolved[i + 1];
      const coords = shape.coordinates.slice(a.vertex, b.vertex + 1);
      addEdge(a.canonical, b.canonical, routeId, pathLength(coords), coords);
    }
    // Close the loop: the last named stop back to the shared start/end
    // terminus, using the shape's TRUE final coordinate — mirrors the
    // endVertex handling in getRouteLegVertices above, since the file
    // only ever records one vertex (0) for the shared start/end name.
    const last = resolved[resolved.length - 1], first = resolved[0];
    const closingCoords = shape.coordinates.slice(last.vertex);
    addEdge(last.canonical, first.canonical, routeId, pathLength(closingCoords), closingCoords);
  }
}

// A transfer isn't actually free in real life — it costs a wait, a walk,
// uncertainty about the next bus's timing. Plain distance-only Dijkstra
// treats it as free, so it happily trades a real transfer for a few
// hundred meters of shorter pavement (e.g. 3B -> 1A -> 3B -> 1B -> 4A
// instead of the far more sensible 1B -> 4A). This constant says: a
// transfer "costs" as much as this many extra meters of riding, so the
// algorithm only takes one when it actually saves more than that.
// Tune to taste — higher values bias harder toward fewer transfers even
// at the cost of a longer ride.
const TRANSFER_PENALTY_METERS = 1200;

// Dijkstra over STOP_GRAPH, but the search STATE is (stop, arrival route)
// rather than just (stop). That's what lets the transfer penalty apply
// exactly where a transfer actually happens — i.e. only when the next
// edge's routeId differs from the route you're CURRENTLY riding — instead
// of being baked flatly into every edge regardless of whether it's a
// continuation of the same bus or a brand new one. Returns { edges,
// distance } where distance is the real physical distance (penalty
// excluded, since that's just a search bias, not an actual travelled km).
//
// A stop NAME isn't always a single physical point: the same label can
// legitimately show up at two vertices that are nowhere near each other
// (a route revisiting its own name on the way back, near-duplicate
// spellings snapped to the same STOPS entry, etc — see the canonical-name
// comments in buildStopGraph above). STOP_GRAPH is keyed purely by name,
// so without a check here Dijkstra can "arrive" at one physical vertex
// and then continue from STOP_GRAPH.get(u)'s full list, which may include
// an edge that actually starts from a totally different, distant vertex
// that just happens to share the same name — stitching together two
// itinerary legs whose coordinates don't actually meet. That produces
// exactly the symptom of a plan marker or route segment appearing to
// "float away" from the rest of the path. MAX_SAME_NAME_HOP_METERS guards
// against that: once we know which real coordinate we arrived at, only
// edges that actually start near that coordinate are eligible next hops.
const MAX_SAME_NAME_HOP_METERS = 150;

function findStopPath(fromName, toName) {
  if (fromName === toName || !STOP_GRAPH.has(fromName)) return null;
  const NONE = ""; // sentinel: "not currently riding any route yet"
  const startKey = fromName + "|" + NONE;
  const dist = new Map([[startKey, 0]]);
  const prev = new Map();
  const visited = new Set();
  const queue = [[0, fromName, NONE]];

  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]);
    const [d, u, viaRoute] = queue.shift();
    const key = u + "|" + viaRoute;
    if (visited.has(key)) continue;
    visited.add(key);
    // null only for the very first (search-origin) state, which has no
    // incoming edge and therefore no ambiguity to resolve yet.
    const arrivalPrev = prev.get(key);
    const arrivalCoord = arrivalPrev ? arrivalPrev.edge.coords[arrivalPrev.edge.coords.length - 1] : null;
    for (const edge of (STOP_GRAPH.get(u) || [])) {
      if (arrivalCoord && haversine(arrivalCoord, edge.coords[0]) > MAX_SAME_NAME_HOP_METERS) continue;
      // Boarding the very first bus (viaRoute === NONE) is never a
      // "transfer" — only a route change mid-trip is.
      const isTransfer = viaRoute !== NONE && viaRoute !== edge.routeId;
      const nd = d + edge.weight + (isTransfer ? TRANSFER_PENALTY_METERS : 0);
      const nkey = edge.to + "|" + edge.routeId;
      if (nd < (dist.get(nkey) ?? Infinity)) {
        dist.set(nkey, nd);
        prev.set(nkey, { fromKey: key, from: u, edge });
        queue.push([nd, edge.to, edge.routeId]);
      }
    }
  }

  // toName may be reachable via several different arrival routes with
  // different penalized costs — take whichever arrival state won.
  let bestKey = null, bestCost = Infinity;
  for (const [key, cost] of dist) {
    if (key.startsWith(toName + "|") && cost < bestCost) { bestCost = cost; bestKey = key; }
  }
  if (bestKey == null) return null;

  const edges = [];
  let curKey = bestKey;
  while (curKey !== startKey) {
    const p = prev.get(curKey);
    if (!p) return null;
    edges.unshift({ ...p.edge, from: p.from });
    curKey = p.fromKey;
  }
  // Report the real ridden distance, not the penalty-inflated search cost.
  const distance = edges.reduce((sum, e) => sum + e.weight, 0);
  return { edges, distance };
}

// Collapses consecutive same-route edges into single "ride this leg" hops,
// so an itinerary reads as "5B: Jombor -> Condongcatur" rather than one
// line per intermediate stop. A change in routeId is a transfer.
function buildItinerary(edges) {
  const legs = [];
  for (const e of edges) {
    const last = legs[legs.length - 1];
    if (last && last.routeId === e.routeId) {
      last.to = e.to;
      last.distance += e.weight;
      last.coords = last.coords.concat(e.coords.slice(1));
    } else {
      legs.push({ routeId: e.routeId, from: e.from, to: e.to, distance: e.weight, coords: e.coords.slice() });
    }
  }
  return legs;
}

function setPlannedRoute(legs) {
  const src = map.getSource("planned-route");
  if (!src) return;
  if (!legs || !legs.length) {
    src.setData({ type: "FeatureCollection", features: [] });
    return;
  }
  src.setData({
    type: "FeatureCollection",
    features: legs.map(leg => ({
      type: "Feature",
      geometry: { type: "LineString", coordinates: leg.coords },
      properties: { color: (ROUTE_META[leg.routeId] || {}).color || "#1c1c1a" }
    }))
  });
}

function routeBadgeHtml(routeId) {
  const meta = ROUTE_META[routeId] || {};
  const color = meta.color || "#888";
  return `<span class="route-badge" style="color:${color};background:${color}22;border-color:${color}55;">${routeId}</span>`;
}

// Small always-on labels (not click popups) pinned at the trip's board,
// transfer, and alight stops. Kept in their own array so a new search (or
// closing the planner) can cleanly tear down the previous set before
// adding the next one — MapLibre Markers don't live on a GeoJSON source
// like the route lines do, so they need to be removed by hand.
let planMarkers = [];
function clearPlanMarkers() {
  planMarkers.forEach(m => m.remove());
  planMarkers = [];
}

function addPlanMarker(coord, html) {
  const wrap = document.createElement("div");
  wrap.innerHTML = html.trim();
  // anchor: "center" (with no offset) on a 0x0 .plan-marker element means
  // the geo point maps to exactly one fixed pixel; every visible child
  // positions itself off that pixel via CSS instead of maplibre trying to
  // center/bottom-align a box whose size changes with its text.
  const marker = new maplibregl.Marker({ element: wrap.firstElementChild, anchor: "center" })
    .setLngLat(coord)
    .addTo(map);
  planMarkers.push(marker);
}

let busLatestLoc = {}; // { bus1: {lat,lng,heading,speed,updatedAt}, bus2: {...} } -- dipakai isi popup info

// Daftar halte terurut per arah (sama persis yang dipakai driver.html buat
// "posisi sekarang") -- dipakai buat nunjukin "Posisi: <nama halte>" di

function haversineMetersForBus(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function nearestStopNameForBus(direction, lat, lng) {
  if (!busOrderedStops || !direction) return null;
  const list = busOrderedStops[direction];
  if (!list || list.length === 0) return null;
  let best = null;
  for (const stop of list) {
    const dist = haversineMetersForBus(lat, lng, stop.lat, stop.lng);
    if (!best || dist < best.dist) best = { name: stop.name, dist };
  }
  return best;
}
